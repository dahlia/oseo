name: main

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Commit to use as the compatibility baseline"
        required: true
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch compatibility baseline
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASELINE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags --depth=1 origin "$BASELINE"
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        runtime:
          - node
          - deno
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:${{ matrix.runtime }}

  test_native:
    name: native (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:native --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform.target }}-${{ matrix.shard }}-of-3
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_test262:
    name: >-
      test262 (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 5
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 6
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 7
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 8
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 9
            total: 10
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 10
            total: 10
          - os: macos-15
            target: macos-aarch64
            shard: 1
            total: 5
          - os: macos-15
            target: macos-aarch64
            shard: 2
            total: 5
          - os: macos-15
            target: macos-aarch64
            shard: 3
            total: 5
          - os: macos-15
            target: macos-aarch64
            shard: 4
            total: 5
          - os: macos-15
            target: macos-aarch64
            shard: 5
            total: 5
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: >-
          mise run test:test262
          --shard ${{ matrix.shard }}/${{ matrix.total }}
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'test262-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_native_support:
    name: >-
      native support (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 4
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 4
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 4
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 4
          - os: macos-15
            target: macos-aarch64
            shard: 1
            total: 6
          - os: macos-15
            target: macos-aarch64
            shard: 2
            total: 6
          - os: macos-15
            target: macos-aarch64
            shard: 3
            total: 6
          - os: macos-15
            target: macos-aarch64
            shard: 4
            total: 6
          - os: macos-15
            target: macos-aarch64
            shard: 5
            total: 6
          - os: macos-15
            target: macos-aarch64
            shard: 6
            total: 6
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - if: matrix.shard == 1
        run: mise run test:property:extended:package
      - run: >-
          mise run test:property:extended:native:shard
          --test-shard=${{ matrix.shard }}/${{ matrix.total }}
          tests/property/*.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'native-support-diagnostics-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  native:
    if: ${{ always() }}
    needs:
      - test_native
      - test_native_support
      - test_test262
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and test262 shard
        run: |
          test "${{ needs.test_native.result }}" = success
          test "${{ needs.test_native_support.result }}" = success
          test "${{ needs.test_test262.result }}" = success
