name: main

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        runtime:
          - node
          - deno
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:${{ matrix.runtime }}

  test_native:
    name: native (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:native --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform.target }}-${{ matrix.shard }}-of-3
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_test262:
    name: test262 (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:test262 --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test262-${{ matrix.platform.target }}-${{ matrix.shard }}-of-3
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_native_support:
    name: native support (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:probes
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:property:extended
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-support-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  native:
    if: ${{ always() }}
    needs:
      - test_native
      - test_native_support
      - test_test262
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and test262 shard
        run: |
          test "${{ needs.test_native.result }}" = success
          test "${{ needs.test_native_support.result }}" = success
          test "${{ needs.test_test262.result }}" = success
