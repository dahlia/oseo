# Generated by tools/generate-macos-lanes.ts; edit its template.
name: main

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Commit to use as the compatibility baseline"
        required: true
        type: string

concurrency:
  # A main push gets its own group keyed by commit, because the ratchet reads
  # the previous push as its baseline. Sharing a group would let GitHub drop a
  # queued main run, and the next run would then measure against a commit no
  # run ever checked.
  group: >-
    main-${{ github.workflow }}-${{ github.ref }}-${{
      github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch compatibility baseline
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASELINE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags origin "$BASELINE"
      - uses: jdx/mise-action@v4
        with:
          install: true
      - name: Check introduced commit messages
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fetch both endpoints without making the history shallow. A
          # force-push's previous tip may no longer be on any remote ref.
          git fetch --no-tags origin "$COMMIT_HEAD"
          if [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BASE"
          fi
          mise run check:commit-messages "$BASE..$COMMIT_HEAD"
      - run: mise run check

  test:
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations: the hosted macOS Node.js suite runs in
        # test_node_shard and the Linux one in test_node_shard_linux, so
        # only Deno joins from either of those hosts here.
        include:
          - os: ubuntu-latest
            runtime: deno
          - os: windows-latest
            runtime: node
          - os: windows-latest
            runtime: deno
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        if: runner.os != 'Windows'
      - run: mise run test:${{ matrix.runtime }}

  # macOS only; the lane generator replaces this with one job per shard.
  # The hosted macOS runner measured 63 minutes for the whole suite in run
  # 38593093817, against 6 on Windows, where no native test can run, so the
  # cost is native build and execution on a slow hosted runner. Node's own
  # --test-shard partitions the files it discovers, which keeps the union
  # equal to the unsharded set by construction.
  test_node_shard_linux:
    name: >-
      test (ubuntu-latest, node,
      ${{ matrix.shard }}/${{ matrix.total }})
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 2
          - shard: 2
            total: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node
          --test-shard=${{ matrix.shard }}/${{ matrix.total }}

  test_native:
    name: native (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: mise run test:native --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform.target }}-${{ matrix.shard }}-of-3
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_sanitizer:
    name: host C sanitizers (Linux, ${{ matrix.shard }}/3)
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ubuntu-latest
    # Run 38957726165 measured 36.1 minutes for the native fixtures and
    # 3.8 for the runtime ones, so one shard carries about 16 minutes and
    # the others 12. 45 minutes leaves cold-cache and slow-runner margin.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
      # Each shard retains its own instrumentation preflight.
      - run: mise run test:sanitizer:self
      # The GCC check and the runtime fixtures do not shard, so one shard
      # carries them.
      - if: matrix.shard == 1
        name: Verify GCC sanitizer instrumentation
        run: mise run test:sanitizer:self
        env:
          OSEO_HOST_CC: gcc
      - if: matrix.shard == 1
        run: mise run test:sanitizer:runtime
      - run: >-
          mise run test:sanitizer:native
          --shard ${{ matrix.shard }}/3
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-failures-${{ matrix.shard }}-of-3
          path: /tmp/oseo-native-*
          if-no-files-found: warn

  test_sanitizer_property:
    name: host C sanitizers (Linux, property, ${{ matrix.shard }}/3)
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ubuntu-latest
    # The full suite took 24.80 to 48.30 minutes across fifteen runs.
    # Main run 40090884630 (2026-10-24) canceled shard 2/2 at the
    # 45-minute limit after 149 passing tests. Its runner was about 1.70x
    # slower than the same-tree candidate, where the shard took about
    # 27 minutes. Three shards add margin for that runner variation.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
      # Each shard retains its own instrumentation preflight.
      - run: mise run test:sanitizer:self
      - run: >-
          mise run test:sanitizer:property:shard
          --test-shard=${{ matrix.shard }}/3
          tests/property/*.property.test.ts
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-property-failures-${{ matrix.shard }}-of-3
          path: /tmp/oseo-native-*
          if-no-files-found: warn

  test_test262:
    name: >-
      test262 (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 5
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 6
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 7
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 8
            total: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:test262
          --shard ${{ matrix.shard }}/${{ matrix.total }}
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'test262-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_native_support:
    name: >-
      native support (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.os }}
    # Run 38551733723 lost a Linux shard to the previous 90-minute limit
    # while its work took a measured 32.9 to 62 minutes across runs; the
    # suites carry their own interrupt deadlines, so this is a backstop.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 5
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 6
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 7
            total: 7
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - if: matrix.shard == 1
        run: mise run test:property:extended:package
      - if: matrix.target == 'linux-x86_64-gnu'
        run: >-
          mise run test:property:extended:native:shard
          --shard ${{ matrix.shard }}/${{ matrix.total }}
          --exclude-case-sharded
          --exclude-dedicated-linux
          tests/property/*.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: matrix.target == 'macos-aarch64'
        run: >-
          mise run test:property:extended:native:shard
          --shard ${{ matrix.shard }}/${{ matrix.total }}
          --exclude-case-sharded
          tests/property/*.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'native-support-diagnostics-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_property_case:
    name: >-
      own-key cases (${{ matrix.target }},
      ${{ matrix.caseShard }}/3)
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 1
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 2
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-object-own-keys.property.test.ts
        env:
          OSEO_PROPERTY_CASE_SHARD: ${{ matrix.caseShard }}/3
          OSEO_PROPERTY_DURATION_FILE: ${{ runner.temp }}/duration.json
          TMPDIR: ${{ runner.temp }}
      - if: success()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('own-key-duration-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/duration.json
          if-no-files-found: error
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('own-key-cases-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_reflect_case:
    name: >-
      reflect cases (${{ matrix.target }},
      ${{ matrix.caseShard }}/3)
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: ${{ matrix.os }}
    # U38 measured a Mac lane at 3 minutes per shard and derives 5.6 for
    # a hosted macOS fallback. A dedicated hosted Linux job has no
    # measurement yet; the 9.8 minutes a third of run 39025004305's
    # contended file shard implies is an upper bound, because that shard
    # gave this file one of four workers. Sixty minutes leaves every one
    # of those a wide margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 1
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 2
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      # No duration record: this file has three property domains and the
      # recorder writes one record per job, so the aggregate's summed
      # deadline check cannot cover it without a record-format change.
      # Each shard still keeps the whole property's interrupt limit and
      # fails on interruption, and run 39025004305 measured the widest
      # suite at 29.8 percent of that limit unsharded.
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-reflect-namespace.property.test.ts
        env:
          OSEO_PROPERTY_CASE_SHARD: ${{ matrix.caseShard }}/3
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('reflect-cases-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_array_constructor:
    name: Array constructor (linux-x86_64-gnu)
    # Only trusted push/manual runs in dahlia/oseo may use the repository
    # variable's JSON label array. PRs, forks, and an unset variable use
    # ubuntu-latest, so untrusted PR code never selects a self-hosted runner.
    if: ${{ !cancelled() }}
    needs:
      - mac_ready
    runs-on: >-
      ${{ fromJSON(github.repository == 'dahlia/oseo' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      vars.OSEO_ARRAY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Runs 40229359492 and 40262591240 stopped at the unchanged 1,800 s
    # property limit after 97 and 92 of 120 cases with four file workers.
    # The same source took about 614 s locally. Allow 30 min for the
    # property plus 15 min for setup/build; this 45 min limit is a backstop.
    timeout-minutes: 45
    # The job may run on a self-hosted runner, so its token can only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-array-constructor.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: array-constructor-linux-diagnostics
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  native:
    # The generator expands needs and replaces steps with success checks.
    if: ${{ always() }}
    needs:
      - test_native
      - test_sanitizer_property
      - test_native_support
      - test_property_case
      - test_reflect_case
      - test_array_constructor
      - test_test262
      - test_native_macos_1
      - test_native_macos_2
      - test_native_macos_3
      - test_test262_macos_1
      - test_test262_macos_2
      - test_test262_macos_3
      - test_test262_macos_4
      - test_test262_macos_5
      - test_test262_macos_6
      - test_test262_macos_7
      - test_test262_macos_8
      - test_test262_macos_9
      - test_test262_macos_10
      - test_test262_macos_11
      - test_test262_macos_12
      - test_native_support_macos_1
      - test_native_support_macos_2
      - test_native_support_macos_3
      - test_native_support_macos_4
      - test_native_support_macos_5
      - test_native_support_macos_6
      - test_native_support_macos_7
      - test_native_support_macos_8
      - test_native_support_macos_9
      - test_native_support_macos_10
      - test_native_support_macos_11
      - test_native_support_macos_12
      - test_reflect_case_macos_1
      - test_reflect_case_macos_2
      - test_reflect_case_macos_3
      - test_property_case_macos_1
      - test_property_case_macos_2
      - test_property_case_macos_3
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and test262 shard
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS);
            const success = results.length > 0 &&
              results.every(result => result === "success");
            process.exit(success ? 0 : 1);
          '
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: actions/download-artifact@v7
        with:
          pattern: own-key-duration-*
          path: ${{ runner.temp }}/property-case-durations
      - run: >-
          mise run check:property-case-durations
          "${{ runner.temp }}/property-case-durations"

  mac_ready:
    name: macOS self-hosted availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      r1: ${{ steps.probe.outputs.r1 }}
      r2: ${{ steps.probe.outputs.r2 }}
      r3: ${{ steps.probe.outputs.r3 }}
      r4: ${{ steps.probe.outputs.r4 }}
      r5: ${{ steps.probe.outputs.r5 }}
      r6: ${{ steps.probe.outputs.r6 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
          install_args: node
      - id: probe
        if: >-
          ${{ github.event_name == 'push' &&
              github.repository == 'dahlia/oseo' }}
        env:
          OSEO_SELFHOSTED_LANES: 6
          OSEO_SELFHOSTED_ENABLED: >-
            ${{ vars.OSEO_SELFHOSTED_MAC_ENABLED }}
          OSEO_EVENT: ${{ github.event_name }}
          OSEO_REPOSITORY: ${{ github.repository }}
          OSEO_RUNNER_STATUS_TOKEN: >-
            ${{ secrets.OSEO_RUNNER_STATUS_TOKEN }}
          OSEO_WORKFLOW_TOKEN: ${{ github.token }}
        run: node tools/selfhosted-mac/availability.ts

  # macOS lane 1, longest jobs first.
  test_sanitizer_macos_macos_property:
    name: host C sanitizers (macOS, property)
    runs-on: macos-15
    if: ${{ !cancelled() }}
    needs: mac_ready
    # Each suite retains its own instrumentation preflight.
    # About 36–44 minutes for runtime/native and 29–35 for properties;
    # 75 minutes leaves room for setup, cold caches, and slower runner images.
    timeout-minutes: 75
    env:
      OSEO_HOST_CC: clang
    steps:
      - name: Record macOS host version
        run: sw_vers -productVersion
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:sanitizer:self
        env:
          TMPDIR: ${{ runner.temp }}
      # No GCC verification: macOS gcc is an Apple Clang alias.
      - run: mise run test:sanitizer:property
        env:
          # Four workers share three CPUs. Double Linux's interrupt allowance,
          # retaining every ordinary case and seed; interruptions still fail.
          OSEO_PROPERTY_TIME_SCALE: "6"
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-macos-property-failures
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  # macOS lane 2, longest jobs first.
  test_sanitizer_macos_macos_native:
    name: host C sanitizers (macOS, native)
    runs-on: macos-15
    if: ${{ !cancelled() }}
    needs: mac_ready
    # Each suite retains its own instrumentation preflight.
    # About 36–44 minutes for runtime/native and 29–35 for properties;
    # 75 minutes leaves room for setup, cold caches, and slower runner images.
    timeout-minutes: 75
    env:
      OSEO_HOST_CC: clang
    steps:
      - name: Record macOS host version
        run: sw_vers -productVersion
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:sanitizer:self
        env:
          TMPDIR: ${{ runner.temp }}
      # No GCC verification: macOS gcc is an Apple Clang alias.
      - run: mise run test:sanitizer:runtime
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:sanitizer:native
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-macos-native-failures
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  # macOS lane 3, longest jobs first.
  test_node_shard_macos_3:
    name: test (macos-latest, node, 3/4)
