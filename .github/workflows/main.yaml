    name: host C sanitizers (macOS, property)
    runs-on: macos-15
    if: ${{ !cancelled() }}
    # Each suite retains its own instrumentation preflight.
    # About 36–44 minutes for runtime/native and 29–35 for properties;
    # 75 minutes leaves room for setup, cold caches, and slower runner images.
    timeout-minutes: 75
    env:
      OSEO_HOST_CC: clang
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:sanitizer:self
        env:
          TMPDIR: ${{ runner.temp }}
      # No GCC verification: macOS gcc is an Apple Clang alias.
      - run: mise run test:sanitizer:property
        env:
          # Four workers share three CPUs. Double Linux's interrupt allowance,
          # retaining every ordinary case and seed; interruptions still fail.
          OSEO_PROPERTY_TIME_SCALE: "6"
          TMPDIR: ${{ runner.temp }}
