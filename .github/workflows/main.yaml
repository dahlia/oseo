name: main

on:
  pull_request:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        runtime:
          - node
          - deno
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:${{ matrix.runtime }}

  test-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install: true
      - run: mise run test:native
      - run: mise run test:probes
      - run: mise run test:property:native
      - run: mise run test:test262
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-fixture-diagnostics-${{ matrix.target }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn
