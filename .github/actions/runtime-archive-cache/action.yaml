name: Runtime archive cache
description: Share the archive matching the native builder's complete reuse key
inputs:
  toolchain:
    description: Native test toolchain
    default: zig
runs:
  using: composite
  steps:
    - run: mise run build
      shell: bash
    - id: archive
      run: mise run ci:runtime-archive-cache >> "$GITHUB_OUTPUT"
      shell: bash
      env:
        OSEO_NATIVE_TOOLCHAIN: ${{ inputs.toolchain }}
    - id: cache
      uses: actions/cache@v5
      with:
        path: ${{ steps.archive.outputs.path }}
        key: ${{ steps.archive.outputs.key }}
    # Cache services can return a primary-key prefix match even without
    # restore-keys. Never let such an entry reach a compiler invocation.
    - if: steps.cache.outputs.cache-hit != 'true'
      run: rm -f -- "$ARCHIVE_PATH"
      shell: bash
      env:
        ARCHIVE_PATH: ${{ steps.archive.outputs.path }}
