name: Set up mise
description: Verify mise restores and retry official downloads
inputs:
  install:
    description: Whether to install project tools
    default: "true"
  install_args:
    description: Arguments passed unchanged to upstream mise install
    default: ""
runs:
  using: composite
  steps:
    - id: release
      uses: ./.github/actions/mise-policy
      with:
        phase: discover
    - id: metadata
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.release.outputs.metadata-dir }}
        key: ${{ steps.release.outputs.metadata-key }}
    - id: policy
      uses: ./.github/actions/mise-policy
      with:
        version: ${{ steps.release.outputs.version }}
        metadata-directory: ${{ steps.release.outputs.metadata-dir }}
        cache-hit: ${{ steps.metadata.outputs.cache-hit }}
        install-args: ${{ inputs.install_args }}
        config-hash: >-
          ${{ hashFiles(
            '**/mise.toml', '**/mise.lock',
            '**/mise.*.toml', '**/mise.*.lock',
            '**/.mise.toml', '**/.mise.lock',
            '**/.mise.*.toml', '**/.mise.*.lock',
            '**/.tool-versions',
            '**/.config/mise.toml', '**/.config/mise.lock',
            '**/.config/mise.*.toml', '**/.config/mise.*.lock',
            '**/.config/mise/config.toml', '**/.config/mise/config.lock',
            '**/.config/mise/config.*.toml',
            '**/.config/mise/config.*.lock',
            '**/.mise/config.toml', '**/.mise/config.lock',
            '**/.mise/config.*.toml', '**/.mise/config.*.lock',
            '**/mise/config.toml', '**/mise/config.lock',
            '**/mise/config.*.toml', '**/mise/config.*.lock') }}
    - uses: actions/cache/save@v5
      if: steps.metadata.outputs.cache-hit != 'true'
      with:
        path: ${{ steps.release.outputs.metadata-dir }}
        key: ${{ steps.release.outputs.metadata-key }}
    - id: cache
      uses: actions/cache/restore@v5
      with:
        path: ${{ steps.policy.outputs.data-dir }}
        key: ${{ steps.policy.outputs.cache-key }}
    - uses: ./.github/actions/mise-policy
      with:
        phase: restore
        directory: ${{ steps.policy.outputs.data-dir }}
        cache-hit: ${{ steps.cache.outputs.cache-hit }}
        sha256: ${{ steps.policy.outputs.sha256 }}
    - uses: jdx/mise-action@v4
      with:
        version: ${{ steps.policy.outputs.version }}
        mise_dir: ${{ steps.policy.outputs.data-dir }}
        cache: "false"
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
      env:
        # Route only these two official Deno assets; keep mise verification.
        MISE_URL_REPLACEMENTS: >-
          {
            "regex:^https://dl\\.deno\\.land/release/v2\\.9\\.7/deno-aarch64-apple-darwin\\.zip\\z":
            "https://github.com/denoland/deno/releases/download/v2.9.7/deno-aarch64-apple-darwin.zip",
            "regex:^https://dl\\.deno\\.land/release/v2\\.9\\.7/deno-aarch64-apple-darwin\\.zip\\.sha256sum\\z":
            "https://github.com/denoland/deno/releases/download/v2.9.7/deno-aarch64-apple-darwin.zip.sha256sum"
          }
        CURL_HOME: ${{ steps.policy.outputs.curl-home }}
        TMPDIR: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        TEMP: ${{ runner.temp }}
    - uses: actions/cache/save@v5
      if: >-
        steps.cache.outputs.cache-hit != 'true' && inputs.install == 'true'
      with:
        path: ${{ steps.policy.outputs.data-dir }}
        key: ${{ steps.policy.outputs.cache-key }}
