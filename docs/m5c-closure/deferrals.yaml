families:
  run-time-source:
    reason: The asserted core contract is observable only through run-time
      source compilation, a var declaration made by direct eval or the
      Function constructor itself, and the maintainer did not approve
      general eval or Function construction for M5. The reviewed evidence
      work found no static or host Script witness that reproduces the
      observation.
  static-specifier-import:
    reason: The path observes its contract only through an ImportCall site,
      which the parse-time OSEO1001 rejection blocks. The DS-12 assessment
      records why static module evidence cannot witness repeated host
      loads, cached evaluation state, deferred evaluation, or staggered
      graph starts. The only route is the build-time static-specifier
      import track, which the maintainer moved past M5; its reviewed
      design is the post-M5 plan that PLAN-DYN.md links.
