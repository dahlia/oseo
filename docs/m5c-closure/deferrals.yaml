      any user toString call, their order and their abrupt completions, happens
      only inside CreateDynamicFunction, which the runtime rejects before
      converting any argument. The 2026-11-01 umbrella-residual answer names
      Function argument conversion as a contract to evidence or defer, so the
      dynamic-construction exclusion, which covers construction from parameter
      and body strings and the resulting instance, does not cover it; ordinary
      ToString or a static function observes neither the call site nor its
      order.
