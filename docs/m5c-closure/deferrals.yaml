      that runs after run-time source compilation, either inside a direct
      eval string or after a fixture calls the Function constructor. The
      static-specifier import track admits literal ImportCall sites in the
      default build, so the remaining blocker is eval or Function
      construction, which the maintainer did not approve for M5.
      PLAN-DYN.md inherits the paths.
