records:
  0013-m5-edition-and-manifest:
    digest: "3922cee52d1c86ce8b5f5c7d5f7969b7d5983863a9865f3588\
      fd6663cace8bf0"
    authorization:
      - Annex B legacy web semantics are excluded from the
        claim.
      - Annex B behavior is reported as unsupported when a
        test inside the boundary depends on it.
    reopening:
      - Evidence that a claimed-excluded section is required
        by a dependency inside the boundary reopens the
        optional-section policy.
  0016-dynamic-source-boundary:
    digest: "0822a6b08675f8328af6cfe24cb657a57cfb713571d2139d64\
      17018662d9bb83"
    authorization:
      - "`eval` in call position, the `Function`
        constructor, `new Function`, and every constructor
        that compiles source text stay outside the M5
        language profile."
      - Affected test262 cases are classified
        `unsupported-profile-feature` through the owned
        `OSEO1001` rejection, whether the frontend reports
        it before execution or the runtime reports it at the
        invocation, and reviewed subset entries name the gap
        with the `dynamic-source` dependency tag so coverage
        summaries can total it.
      - Dynamic import remains rejected at parse time.
    reopening:
      - Admitting the build-time-resolvable subset requires
        a separate reviewed plan and an update to this
        record, following alternative 3.
      - the compatibility laboratory shows that packages
        Oseo targets cannot run without `eval`, `Function`,
        or unrestricted dynamic import;
      - a probe demonstrates staged compilation with
        acceptable code lifetime, rooting, and target
        coverage; or
      - the WinterTC profile targeted by M6 makes one of
        these features a conformance requirement that
        documented server-runtime deviations cannot cover.
  0019-m5-claim-closure:
    digest: "dc1a9429af215b1a91f50ee5097da706f5e2089bf46c4184cf\
      830b27f2b0e5d7"
    authorization:
      - every result inside it is a pass, an expected
        negative, or an unsupported result covered by an
        accepted record that explicitly authorizes an M5
        exclusion and bounds its surface.
      - ADR 0016 is such a record for the dynamic source
        family.
    reopening:
      - Evidence that a normative section inside the claim
        depends on the excluded dynamic source family for
        behavior other than source evaluation reopens the
        boundary rather than this record.
  0028-legacy-function-caller-boundary:
    digest: "50e92d79e587a8ef27c5b641a0c8352ee02db689af822e3d62\
      b89e832cf23338"
    authorization:
      - The optional legacy caller extension is outside the
        M5 profile.
      - This record authorizes an M5 exclusion of the
        expectation that reading the `caller` property of a
        non-strict ordinary function completes normally, and
        only for the exact 23 paths listed under “Exact
        selector” below.
    reopening:
      - Evidence from target packages that caller
        introspection is required reopens this boundary.
      - A reviewed runtime design that supports a useful,
        bounded caller contract at acceptable optimization
        and maintenance cost reopens it.
      - A later edition or a revised claim that makes the
        behavior required reopens it.
      - New source evidence that one of these paths mainly
        tests a mandatory contract this boundary would leave
        uncovered reopens it for that path.
assessments:
  dynamic-construction:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The assertion covers construction from
      parameter/body strings or the resulting dynamic
      function instance, including its source
      representation; ADR 0016 excludes that construction
      and its results, not corresponding properties of
      statically declared functions.
  eval-semantics:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The assertion requires eval source parsing,
      eval-specific early errors, direct/indirect
      evaluation, or binding and super lookup from eval
      code. This is source evaluation itself, within ADR
      0016; ordinary static scope and super semantics stay
      inside the claim.
  fixture-construction:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The test uses a rejected eval call or
      source-compiling constructor to obtain an input or
      callable. Its normative subject stays inside the
      claim; a test dependency alone does not show that the
      normative algorithm requires dynamic source. ADR 0019
      reopening is not proved, but unrelated coverage cannot
      be closed without reviewed replacement evidence or a
      maintainer accounting decision.
  regexp-roundtrip:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: EscapeRegExpPattern requires a parsable
      RegularExpressionLiteral with equivalent behavior, not
      a runtime eval call. The test uses eval to observe
      that round trip; the required escaping and equivalence
      contract stays inside the claim. Replacement
      parser/native evidence or a maintainer accounting
      decision is needed, not an assertion that regexp
      source is excluded.
  completion-observation:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: Statement evaluation defines Completion Records
      without requiring eval. The test uses eval to expose
      their values to assertions, so it leaves
      completion-value coverage unresolved. This is an
      observation gap, not demonstrated normative dependence
      on dynamic source; replacing eval by a function return
      would not preserve the contract.
  template-sites:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: GetTemplateObject requires caching by Parse Node
      identity, including sites created by repeated source
      evaluation. The rejection is within ADR 0016, but
      template identity is behavior other than source
      evaluation. This review cannot close that in-claim
      interaction without replacement identity evidence or a
      maintainer boundary decision; ADR 0019 reopening
      remains a concrete question.
  variable-environment:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The test uses eval var declarations to distinguish
      the variable environment retained by a for-in head or
      catch parameter. The rejected call is authorized, but
      environment retention is inside the claim. Replacing
      eval with assignment does not distinguish those
      environments; retain remediation until independent
      evidence or a maintainer decision bounds the gap.
  annex-b-pattern:
    remediationOwner: node:regexp-split-coverage-remediation
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The observed rejection is the Annex B-only /\k<x>/
      pattern, which ADR 0013 excludes. The same original
      path has many core String and RegExp split assertions
      that are not excluded and do not require that legacy
      pattern normatively. Rejection is authorized but
      whole-path closure is unresolved, so retain a separate
      RegExp split coverage remediation owner until
      replacement evidence or a maintainer accounting
      decision bounds the core assertions.
  mixed-static-functions:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The source includes assertions on a statically
      declared async function or
      declaration/expression-syntax generators before
      dynamic construction. The rejected constructor call
      does not authorize excluding static constructibility
      or instanceof behavior. Keep remediation until
      replacement evidence or a maintainer accounting
      decision bounds these assertions.
  intrinsic-constructor-is-constructor:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The subject is IsConstructor of a source-compiling
      intrinsic constructor obtained statically by the
      reviewed harness. The isConstructor assertion passes
      it only as newTarget of Reflect.construct and
      completes before the trailing zero-argument
      construction reaches the ADR 0016 run-time boundary.
      The rejected construction does not authorize excluding
      the [[Construct]] presence assertion. Keep remediation
      until replacement evidence or a maintainer accounting
      decision bounds it.
  annex-b-typed-array-prototype:
    disposition: remediation
    normativeDependency: not-demonstrated
    remediationOwner: node:typed-array-proto-coverage-remediation
    replacementEvidence:
      tests/native/fixtures/typed-array-constructors.ts:
        "0fda23dff34deff74f9b8938bf5e2e19910343fe56ea863316\
        236f42e342f1ec"
      "tests/property/m5-typed-array-constructors.property.test.ts":
        "ef8f8b1f2d88099bbbcd0ae35de4953f4a932f3242e6503a3a\
        2b59909e3ee20d"
    reason: The only observed failure is the excluded Annex B
      __proto__ read. The source also requires
      TypedArray-to-TypedArray cloning to ignore an
      ArrayBuffer subclass constructor and species, and
      checks the fresh buffer prototype and constructor. The
      typed-array-buffer-without-species-core native fixture
      retains the subclass, throwing constructor and species
      getter, clone, and both core assertions using
      Object.getPrototypeOf for prototype reflection.
      Existing constructor properties supply generated clone
      and buffer evidence. These core algorithms do not
      normatively require Annex B; retain bounded
      remediation until the maintainer accounting decision,
      without authorizing a whole-path exclusion.
  import-call-attributes:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The subject is ImportCall itself under
      sec-import-call-runtime-semantics-evaluation, with a
      string-literal specifier. The source asserts how
      ImportCall forwards the Yield, Await, and In
      parameters to its arguments, how EvaluateImportCall
      treats the options argument (abrupt return and throw
      completions, the with getter,
      EnumerableOwnPropertyNames enumeration, rejection of
      non-object options and non-string values, and promise
      settlement), or that an ImportCall with a trailing
      comma is valid syntax in a given context. Twenty of
      those generated syntax cases place the call in a
      function that is never called, so only the parse is at
      issue; the others also evaluate the call. Each
      assertion of the runtime cases observes an ImportCall
      evaluation or its promise. The syntax cases assert
      nothing beyond a successful parse, except the two
      with-expression cases, which also check that the call
      returns a promise. ADR 0016 keeps import(), part of
      its dynamic source family, rejected at parse time. The
      maintainer accounting decision of 2026-10-22 accepts
      this bounded exclusion of these reserved paths. It
      reopens when an accepted ADR 0016 amendment admits any
      form of dynamic import, including the build-time
      literal subset of docs/dynamic-import-staged-plan.md,
      which admits no options.
  import-call-attributes-computed-specifier:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The subject is ImportCall itself under
      sec-import-call-runtime-semantics-evaluation. The
      source asserts the order in which the specifier and
      options arguments are evaluated, or the rejection
      produced when ToString of an object specifier throws,
      with and without an options argument, each call
      followed by a trailing comma. Every assertion runs
      through import(), which ADR 0016 keeps rejected at
      parse time. The specifier is computed at run time, so
      these paths stay outside even the build-time literal
      subset of docs/dynamic-import-staged-plan.md. The
      maintainer accounting decision of 2026-10-22 accepts
      this bounded exclusion; an accepted ADR 0016 amendment
      that admits any form of dynamic import reopens it for
      reassessment.
  json-module-dynamic-site-identity:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    replacementEvidence:
      tests/fixtures/import-attributes/cycle.mjs:
        "b9c59034c52fac5ce3507ad75cdeb7b55d097ef6f3d965ce0f\
        ec836d487d7c35"
      tests/fixtures/import-attributes/entry.mjs:
        "86f0cc52c67ba959156355fffdbf252e7c404c351483457ab9\
        8078000fc8faf9"
      tests/property/m5-import-attributes.property.test.ts:
        "36ae672a0e4761633f067e97d8e8110e9596eb4495c8c1b1d3\
        80b659839248f8"
    reason: The subject is that every import site of one JSON
      module receives the same object, and the import sites
      include a dynamic import() call. Its static sites do
      not depend on dynamic import. The bound fixture graph
      imports one JSON module through two static default
      imports and an indirect module, and the static JSON
      identity properties assert both identities natively
      and under Node.js and Deno. The only assertion that
      evidence cannot replace compares the import() site,
      which runs only through ImportCall, and ADR 0016 keeps
      import() rejected at parse time. The exclusion is
      bounded to that dynamic site; static JSON module
      identity stays inside the claim. The maintainer
      accounting decision of 2026-10-22 accepts it, and an
      accepted ADR 0016 amendment that admits any form of
      dynamic import reopens it.
  annex-b-legacy-lookup:
    disposition: remediation
    normativeDependency: not-demonstrated
    remediationOwner: node:class-private-accessor-lookup-coverage-remediation
    reason: The only observed rejection is the optional legacy
      Object.prototype.__lookupGetter__ or __lookupSetter__
      call, which ECMA-262 20.1.3.9 defines as normative
      optional and ADR 0020 maps onto the ADR 0013 Annex B
      exclusion. The same source asserts that the private
      getter or setter is neither an own property nor found
      by public-name membership, then reads the private
      getter or writes through the private setter. Those
      private accessor subjects do not require the legacy
      method and stay inside the claim. Rejection is
      authorized, but whole-path closure is unresolved;
      retain the bounded private accessor coverage
      remediation owner until replacement evidence and the
      maintainer accounting decision, without authorizing a
      whole-path exclusion.
  legacy-caller:
    disposition: exclusion
    normativeDependency: legacy-caller-only
    reason: The test calls a non-strict ordinary function and
      requires a read of its `caller` property, or of
      `arguments.callee.caller`, to complete normally. The
      16th edition requires no such own property; without
      one, the read reaches the %ThrowTypeError% accessor
      that AddRestrictedFunctionProperties installs on
      %Function.prototype% and throws. ADR 0028 excludes
      only that optional expectation for its exact selector.
      The prototype accessors, the clause 17.1 restrictions,
      and the absence of an own `caller` on arguments
      objects stay inside the claim with their own evidence
      or remediation owners. Any `eval` or `Function` call
      is scaffolding for the caller relationship and stays
      under ADR 0016, which owns none of these paths.
  annex-b-out-of-bounds-prototype-setup:
    disposition: remediation
    normativeDependency: not-demonstrated
    remediationOwner: node:typed-array-proto-coverage-remediation
    replacementEvidence:
      tests/native/fixtures/typed-array-core.ts:
        "d56aaa14ebbd751e195d0133a1a82d4caa165909e64b85e1e7\
        24792328062c20"
    reason: The only observed failure is the excluded Annex B
      __proto__ write. The program compiles and runs the
      harness, the resizable buffer, and the length-4
      Int8Array view, then reports OSEO1001 at 272:1, the
      i8a.__proto__ assignment that would install a
      prototype with index 2 through the omitted setter, so
      no assertion of the original source ran. The source
      requires an out-of-bounds view to answer Get and
      HasProperty for an index as if it were detached,
      without consulting a prototype that has that index.
      The typed-array-core native fixture installs such a
      prototype, inheriting from Int8Array.prototype, with
      Object.setPrototypeOf on a fixed-length and a
      length-tracking view, witnesses its identity and an
      inherited label, and checks Get and in before
      shrinking, out of bounds, and after regrowing. These
      core algorithms do not normatively require Annex B;
      retain bounded remediation until the maintainer
      accounting decision, without authorizing a whole-path
      exclusion.
  annex-b-resizable-typed-array-prototype:
    disposition: remediation
    normativeDependency: not-demonstrated
    remediationOwner: node:typed-array-proto-coverage-remediation
    replacementEvidence:
      tests/native/fixtures/typed-array-constructors.ts:
        "0fda23dff34deff74f9b8938bf5e2e19910343fe56ea863316\
        236f42e342f1ec"
      "tests/property/m5-typed-array-constructors.property.test.ts":
        "ef8f8b1f2d88099bbbcd0ae35de4953f4a932f3242e6503a3a\
        2b59909e3ee20d"
    reason: The only observed failure is the excluded Annex B
      __proto__ read. The program compiles and runs the
      harness, both buffer allocations, and the first listed
      constructor's two views, ta_rab over the resizable
      buffer and then ta_ab over the fixed-length buffer;
      the runtime then reports OSEO1001 at the
      ta_ab.__proto__ read, recorded at 275:20 as the first
      operand of the first prototype comparison, so no
      prototype assertion of the original source ran. The
      source requires fixed-length views over a resizable
      and a fixed-length buffer to share their prototype for
      every constructor of the resizable buffer harness,
      including its three class subclasses. The
      typed-array-constructors native fixture builds each
      such pair, observes both prototypes through
      Object.getPrototypeOf instead of the accessor, and
      compares them with each other and with the
      constructor's prototype. The construction order
      property's fixed case adds fixed-buffer views and
      length-tracking resizable-buffer views of Float64Array
      and BigInt64Array under own, bound, and Proxy new
      targets. These core algorithms do not normatively
      require Annex B; retain bounded remediation until the
      maintainer accounting decision, without authorizing a
      whole-path exclusion.
  static-this-and-call-context:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The original asserts ordinary strict or non-strict
      this/call or construction behavior of statically
      defined functions, beside or through rejected
      eval/Function source. Preserve those in-claim
      contracts and every original assertion; reviewed
      equivalent static call-context evidence and a
      maintainer accounting decision remain required. This
      assessment authorizes no whole-path exclusion.
  mixed-typeof-callability:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: Source-constructed function typeof checks precede
      independent typeof checks of Object, String, Boolean,
      Number, Date, Error and RegExp intrinsics. The source
      rejection prevents this original from executing those
      core assertions. Preserve all callable-intrinsic
      contracts pending reviewed replacement evidence and
      maintainer accounting; this is not an exclusion.
  parameter-expression-variable-environment:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: Parameter-expression eval var declarations
      distinguish the environment used by computed keys or
      destructuring defaults from parameter and body
      bindings. Assignment is not demonstrated equivalence
      for those environments. Preserve the exact inner/outer
      binding visibility assertions pending independent
      evidence or a maintainer accounting decision; no
      exclusion is authorized.
  observation-train-dynamic-source:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: Root retains all 459 B19/B20/B30 unknown-eval and ImportExpression
      rejections as active coverage remediation. Original source, subjects and
      assertions remain visible; the observation does not establish equivalent
      replacement evidence or authorize a whole-path exclusion. ADR 0016 and
      ADR 0019 are unchanged, including their reopening triggers.
