records:
  0013-m5-edition-and-manifest:
    digest: 323e83e1a84e1b87363505324ebac5420af8a3566aabcccaa1c7cc3fb9eb7070
    authorization:
      - Annex B legacy web semantics are excluded from the claim.
      - Annex B behavior is reported as unsupported when a test inside
        the boundary depends on it.
    reopening:
      - Evidence that a claimed-excluded section is required by a
        dependency inside the boundary reopens the optional-section
        policy.
  0016-dynamic-source-boundary:
    digest: 2a3437aeff09377c85c3c5a5d2e41bf1caefeb196acfe0fd33b0eec2b57706b9
    authorization:
      - "`eval` in call position, the `Function` constructor, `new
        Function`, and every constructor that compiles source text stay
        outside the M5 language profile."
      - Affected test262 cases are classified
        `unsupported-profile-feature` through the existing compile-stage
        rejection, and reviewed subset entries name the gap with the
        `dynamic-source` dependency tag so coverage summaries can total
        it.
    reopening:
      - the compatibility laboratory shows that packages Oseo targets
        cannot run without `eval`, `Function`, or unrestricted dynamic
        import;
      - a probe demonstrates staged compilation with acceptable code
        lifetime, rooting, and target coverage; or
      - the WinterTC profile targeted by M6 makes one of these features
        a conformance requirement that documented server-runtime
        deviations cannot cover.
  0019-m5-claim-closure:
    digest: dc1a9429af215b1a91f50ee5097da706f5e2089bf46c4184cf830b27f2b0e5d7
    authorization:
      - every result inside it is a pass, an expected negative, or an
        unsupported result covered by an accepted record that explicitly
        authorizes an M5 exclusion and bounds its surface.
      - ADR 0016 is such a record for the dynamic source family.
    reopening:
      - Evidence that a normative section inside the claim depends on
        the excluded dynamic source family for behavior other than
        source evaluation reopens the boundary rather than this record.
assessments:
  dynamic-construction:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The assertion covers construction from parameter/body strings or
      the resulting dynamic function instance, including its source
      representation; ADR 0016 excludes that construction and its
      results, not corresponding properties of statically declared
      functions.
  eval-semantics:
    disposition: exclusion
    normativeDependency: source-evaluation-only
    reason: The assertion requires eval source parsing, eval-specific early
      errors, direct/indirect evaluation, or binding and super lookup
      from eval code. This is source evaluation itself, within ADR 0016;
      ordinary static scope and super semantics stay inside the claim.
  fixture-construction:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The test uses a rejected eval call or source-compiling
      constructor to obtain an input or callable. Its normative subject
      stays inside the claim; a test dependency alone does not show that
      the normative algorithm requires dynamic source. ADR 0019
      reopening is not proved, but unrelated coverage cannot be closed
      without reviewed replacement evidence or a maintainer accounting
      decision.
  regexp-roundtrip:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: EscapeRegExpPattern requires a parsable RegularExpressionLiteral
      with equivalent behavior, not a runtime eval call. The test uses
      eval to observe that round trip; the required escaping and
      equivalence contract stays inside the claim. Replacement
      parser/native evidence or a maintainer accounting decision is
      needed, not an assertion that regexp source is excluded.
  completion-observation:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: Statement evaluation defines Completion Records without
      requiring eval. The test uses eval to expose their values to
      assertions, so it leaves completion-value coverage unresolved.
      This is an observation gap, not demonstrated normative dependence
      on dynamic source; replacing eval by a function return would not
      preserve the contract.
  template-sites:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: GetTemplateObject requires caching by Parse Node identity,
      including sites created by repeated source evaluation. The
      rejection is within ADR 0016, but template identity is behavior
      other than source evaluation. This review cannot close that
      in-claim interaction without replacement identity evidence or a
      maintainer boundary decision; ADR 0019 reopening remains a
      concrete question.
  variable-environment:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The test uses eval var declarations to distinguish the variable
      environment retained by a for-in head or catch parameter. The
      rejected call is authorized, but environment retention is inside
      the claim. Replacing eval with assignment does not distinguish
      those environments; retain remediation until independent evidence
      or a maintainer decision bounds the gap.
  annex-b-pattern:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The observed rejection is the Annex B-only /\k<x>/ pattern,
      which ADR 0013 excludes. The same original path has many core
      String and RegExp split assertions that are not excluded and do
      not require that legacy pattern normatively. Rejection is
      authorized but whole-path closure is unresolved, so retain a
      separate RegExp split coverage remediation owner until replacement
      evidence or a maintainer accounting decision bounds the core
      assertions.
  mixed-static-functions:
    disposition: remediation
    normativeDependency: not-demonstrated
    reason: The source includes assertions on a statically declared async
      function or declaration/expression-syntax generators before
      dynamic construction. The rejected constructor call does not
      authorize excluding static constructibility or instanceof
      behavior. Keep remediation until replacement evidence or a
      maintainer accounting decision bounds these assertions.
