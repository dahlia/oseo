version: 1
id: annexb-function-declarations
title: "Annex B function declarations"
scope:
  - "Labelled function declarations of B.3.1 and if-clause function
    declarations of B.3.3 in non-strict code, with every strict and
    statement-position form kept an early error."
  - "The B.3.2.1 var-scoped binding and evaluation copy of a qualifying
    block-level function in function code, and its skip rules for
    parameters, the needed arguments object, and every early-error conflict a
    var of the name would raise."
  - "The B.3.2.2 global-object binding of a qualifying block-level function
    in Script code, skipped without an error when a lexical declaration or
    CanDeclareGlobalVar forbids it."
  - "Duplicate ordinary function declarations in one Block or CaseBlock of
    non-strict code, B.3.2.4 and B.3.2.5."
