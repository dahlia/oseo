version: 1
id: upsert
title: "Map and WeakMap upsert"
scope:
  - "Map.prototype.getOrInsert, Map.prototype.getOrInsertComputed,
    WeakMap.prototype.getOrInsert, and
    WeakMap.prototype.getOrInsertComputed, their descriptors, names,
    lengths, non-constructor status, and receiver checks."
  - "Key canonicalization of -0, SameValueZero lookup, insertion order,
    and the single callback call with an undefined receiver and the
    canonical key."
  - "The lookup after the callback that lets a record the callback
    created take the computed value, and the append after a callback
    that deleted entries or cleared the map."
  - "CanBeHeldWeakly rejection, callability rejection, and ephemeron
    storage for the WeakMap forms."
owners:
  - docs/language-profile-es2026.md
