version: 1
id: annexb-string-methods
title: "Annex B String.prototype methods"
scope:
  - "String.prototype.substr of B.2.2.1: RequireObjectCoercible and
    ToString of the receiver, ToIntegerOrInfinity of start and length in
    that order, the end-relative start, and the clamped length."
  - "The thirteen HTML methods of B.2.2.2 through B.2.2.14 and their shared
    CreateHTML: each tag, the four attribute names, the attribute value's
    ToString after the receiver's, and the &quot; escaping of quotation
    marks."
  - "String.prototype.trimLeft and trimRight of B.2.2.15 and B.2.2.16 as
    the trimStart and trimEnd function objects, in every realm."
  - "The names, lengths, absent prototype properties, and writable,
    non-enumerable, configurable descriptors of all sixteen properties."
