version: 1
id: using-declarations
title: "using and await using declarations"
scope:
  - "using and await using declarations in blocks, function and static
    block bodies, switch clause blocks, and module top level, their const
    binding, TDZ, and NamedEvaluation, and AddDisposableResource before
    InitializeBinding."
  - "Disposal of a scope's resources in reverse order when it completes,
    for every transfer that leaves it (normal, break, continue, return,
    throw, and generator return) and none that stays inside, with the
    SuppressedError chain and a failure while adding."
  - "using heads of classic for statements, disposed once when the loop
    completes, and of for-of and for-await-of statements, disposed per
    iteration before the iterator is closed."
  - "await using: the Await of each asynchronous result in the suspended
    frame, the single Await for null resources, no Await for a scope that
    added nothing, the Symbol.dispose fallback, and asynchronous module
    evaluation."
