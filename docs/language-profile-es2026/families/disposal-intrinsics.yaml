version: 1
id: disposal-intrinsics
title: "Explicit resource management built-ins"
scope:
  - "SuppressedError: its global binding, constructor shape, [[ErrorData]],
    message conversion before the error and suppressed properties, the
    absent cause, and the new-target prototype with its realm fallback."
  - "Symbol.dispose and Symbol.asyncDispose as the fourteenth and fifteenth
    well-known symbols, shared by every realm, and the dispose methods of
    %Iterator.prototype% and %AsyncIteratorPrototype%."
  - "DisposableStack and AsyncDisposableStack: constructors, prototype
    members and descriptors, receiver and disposed-state checks, use,
    adopt, defer, move, the disposed getter, and DisposeResources in
    reverse order with the SuppressedError chain, including the
    asynchronous awaits, the null-resource await, and the Symbol.dispose
    fallback whose result is discarded."
