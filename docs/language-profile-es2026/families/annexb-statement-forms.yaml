version: 1
id: annexb-statement-forms
title: "Annex B statement forms"
scope:
  - "The B.3.5 initializer of a non-strict for (var x = init in obj) head,
    evaluated once before the subject, with NamedEvaluation and labels that
    still name the loop."
  - "The run-time ReferenceError for a function call used as the target of
    an assignment, a compound assignment, an update, or a for-in or for-of
    head in non-strict code, thrown after the call and before the right
    operand, the conversion, or the store."
  - "The catch parameter redeclaration rows of B.3.4, which the M5 profile
    already implements."
owners:
  - docs/language-profile-es2026.md
