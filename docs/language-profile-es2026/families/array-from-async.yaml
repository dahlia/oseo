version: 1
id: array-from-async
title: "Array.fromAsync"
scope:
  - "The Array.fromAsync function property, its descriptor, name, length,
    and non-constructor status, and the %Promise% it returns for every
    input, including a rejection for each abrupt completion."
  - "The Symbol.asyncIterator and Symbol.iterator reads, async iterables
    with values that are not awaited, sync iterables through the
    Async-from-Sync wrapper, and array-likes with one length read and an
    Await per element, the mapper and its thisArg, and constructor and
    other receivers."
  - "The order of observable steps and the turns each Await takes, the
    closes after a mapper, mapped-value, or definition failure with the
    Await on the return result, and propagation without a close for
    failures of the iterator itself and of the final length Set."
owners:
  - docs/language-profile-es2026.md
