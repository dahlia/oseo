version: 1
id: static-specifier-import
title: "Static-specifier import()"
scope:
  - "An ImportCall whose only argument is one string literal, at any site
    in a module or in a Script with a build-side referrer identity, as
    the amended ADR 0016 admits: build-time resolution of the target's
    closure, a fresh %Promise% capability per call, synchronous host
    load completion, and evaluation through the runtime module driver."
  - "Single evaluation per canonical identity, shared namespace objects,
    cached evaluation errors and cycle-root error identity, joined
    pending evaluations, and the edition's fulfillment and rejection
    order. Computed specifiers, options, phase imports, and import() in
    eval or Function source stay OSEO1001 profile diagnostics, and a
    target the build cannot resolve, load, parse, link, or compile is a
    build refusal reported as a subset boundary."
owners:
  - docs/adr/0016-dynamic-source-boundary.md
  - docs/static-specifier-import-design.md
