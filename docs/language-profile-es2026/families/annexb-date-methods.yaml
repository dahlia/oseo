version: 1
id: annexb-date-methods
title: "Annex B Date.prototype methods"
scope:
  - "Date.prototype.getYear of B.2.3.1: YearFromTime(LocalTime(t)) minus
    1900 under the realm's UTC local time zone, NaN for an invalid date,
    and the TypeError for a receiver without [[DateValue]]."
  - "Date.prototype.setYear of B.2.3.2: the receiver check and time-value
    read before ToNumber(year), the +0 start for an invalid date,
    MakeFullYear's 0 to 99 window, MakeDay, MakeDate, UTC, TimeClip, and
    the stored and returned result."
  - "Date.prototype.toGMTString of B.2.3.3 as the toUTCString function
    object, in every realm."
  - "The names, lengths, absent prototype properties, and writable,
    non-enumerable, configurable descriptors of all three properties."
