version: 1
id: iterator-concat
title: "Iterator.concat"
scope:
  - "The Iterator.concat function property, its descriptor, name, length,
    and non-constructor status, and its %IteratorHelperPrototype% result."
  - "Item validation and the single Symbol.iterator read at call time, lazy
    opening in item order, the single next read per opened iterator, fresh
    result objects, and the value read only from results that are not
    done."
  - "Completion without a close after a throw while opening or stepping,
    return forwarding to the suspended inner iterator only, and the
    running-generator TypeError for next and return."
