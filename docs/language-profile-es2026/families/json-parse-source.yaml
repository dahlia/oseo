version: 1
id: json-parse-source
title: "JSON.rawJSON, JSON.isRawJSON, and reviver source text"
scope:
  - "The JSON.rawJSON and JSON.isRawJSON function properties, their
    descriptors, names, lengths, and non-constructor status."
  - "JSON.rawJSON text validation, its frozen null-prototype result with
    [[IsRawJSON]], JSON.isRawJSON over every value kind, and the raw text
    JSON.stringify emits after toJSON and the replacer."
  - "The context argument JSON.parse passes a callable reviver, its source
    property for primitives that still hold their parsed value, and its
    absence for containers and for added or replaced values."
