version: 1
id: error-is-error
title: "Error.isError"
scope:
  - "The Error.isError own property of %Error%, its descriptor, name,
    length, and non-constructor status, and its inheritance by the other
    error constructors."
  - "The [[ErrorData]] answer for every native error kind, AggregateError,
    subclass instances, Reflect.construct results, runtime-thrown errors,
    promise rejection reasons, and errors of another realm."
  - "The false answer for proxies of errors, revoked proxies, error
    prototype objects, objects inheriting from an error prototype, objects
    whose Symbol.toStringTag is Error, and every primitive."
