version: 1
id: annexb-escape
title: "Annex B escape and unescape"
scope:
  - "The realm-owned Annex B global functions escape and unescape of B.2.1,
    their names, lengths, [[Prototype]], absent prototype property, and the
    writable, non-enumerable, configurable global-object properties that
    bind them in every realm."
  - "escape, B.2.1.1: the unescaped ASCII letters, digits, and @*_+-./, the
    uppercase %XX form for every other code unit below 256, and the
    uppercase %uXXXX form for every other code unit, including lone
    surrogates."
  - "unescape, B.2.1.2: the %uXXXX form tried before the %XX form, digits of
    either letter case, and every % that starts neither form kept
    unchanged."
  - "The single-argument ToString conversion each function performs first,
    including the abrupt completion a throwing conversion propagates."
owners:
  - docs/language-profile-es2026.md
