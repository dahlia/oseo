version: 1
id: annexb-object-accessors
title: "Annex B Object accessors"
scope:
  - "The Object.prototype.__proto__ accessor of 20.1.3.8: the getter's
    ToObject and [[GetPrototypeOf]], and the setter's
    RequireObjectCoercible, its silent return for a primitive receiver or a
    prototype that is neither an object nor null, and the TypeError when
    [[SetPrototypeOf]] refuses, in every realm."
  - "Every caller that reaches the accessor as an ordinary property:
    [[Get]] and [[Set]] walks, Reflect.get and Reflect.set with a receiver,
    super property reads and assignment, Proxy forwarding without traps,
    Object.assign, and Function.prototype.call, apply, and bind."
  - "Object.prototype.__defineGetter__ and __defineSetter__ of 20.1.3.9
    and 20.1.3.10: ToObject, the callability check before ToPropertyKey,
    and DefinePropertyOrThrow of an enumerable, configurable accessor half."
  - "Object.prototype.__lookupGetter__ and __lookupSetter__ of 20.1.3.11
    and 20.1.3.12: the [[GetOwnProperty]] and [[GetPrototypeOf]] walk,
    including Proxy traps, and undefined for a data property or a missing
    key."
  - "The names, lengths, non-constructibility, absent prototype
    properties, and descriptors of the six functions, their creation order
    after the seven core Object.prototype properties, and descriptor round
    trips, deletion, redefinition, integrity levels, and for-in over the
    accessor property."
