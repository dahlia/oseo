version: 1
id: uint8array-base64
title: "Uint8Array base64 and hex"
scope:
  - "Uint8Array.fromBase64, Uint8Array.fromHex, and
    Uint8Array.prototype.toBase64, setFromBase64, toHex, and setFromHex,
    their descriptors, names, lengths, property order, non-constructor
    status, and Uint8Array receiver checks."
  - "String inputs without coercion, GetOptionsObject, the alphabet,
    lastChunkHandling, and omitPadding options read once in order without
    coercion, and the bounds check after the option reads."
  - "FromBase64 with both alphabets, ASCII whitespace, padding, the three
    lastChunkHandling modes, the stop at a full target, partial writes
    before a SyntaxError, and the read and written result; FromHex and
    its odd-length rejection."
  - "Detached buffers, length-tracking and fixed views of resizable
    buffers, out-of-bounds views, subarrays, and SharedArrayBuffer
    targets."
