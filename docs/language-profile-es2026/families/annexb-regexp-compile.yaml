version: 1
id: annexb-regexp-compile
title: "Annex B RegExp.prototype.compile"
scope:
  - "RegExp.prototype.compile of B.2.4.1: the receiver check, the TypeError
    for a RegExp pattern with flags, the copy of a RegExp pattern's
    original source and flags, and RegExpInitialize of the receiver in
    place with the constructor's conversion order and validation."
  - "The lastIndex reset after reinitialization and its TypeError on a
    non-writable lastIndex, with the receiver already holding the new
    pattern, and a SyntaxError that leaves the receiver unchanged."
  - "Literal, constructed, and subclass receivers, recompilation from user
    code that @@split and exec run, and the name, length, and writable,
    non-enumerable, configurable descriptor of the method."
