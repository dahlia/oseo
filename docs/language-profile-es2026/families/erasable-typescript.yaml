version: 1
id: erasable-typescript
title: "Erasable TypeScript syntax"
scope:
  - "Type annotations at every binding, parameter, return, field and
    expression position supported by the JavaScript profile; interfaces,
    type aliases, as, satisfies, non-null assertions, generic parameters and
    arguments, ambient declarations, overload signatures, optional and this
    parameters,
    class type modifiers and type-only imports and exports."
  - "The Node.js type-stripping boundary: namespaces containing only types
    erase; enums, namespaces with runtime statements, parameter properties,
    import aliases with values, angle-bracket assertions and export assignment
    remain unsupported. The parser rejects decorators. Runtime JavaScript
    still follows the independently admitted ECMAScript profile."
  - "Only any, bigint, boolean, null, number, string, undefined and unknown
    map to hints. Existing inline object, tuple and array destructuring
    mappings remain. Unresolved annotations erase without hints; container
    mismatches leave bindings unhinted. Type checking and type-driven import
    elision are absent."
  - "Function source text follows Node.js whitespace-preserving stripping,
    including comments outside erased spans and CRLF line endings. Deno
    reformats function text when loading TypeScript, so source-text identity
    uses Node.js alone; other execution observations compare with both hosts."
  - "Whole import type and export type declarations create no module request.
    Inline type specifiers erase individually, preserving a remaining empty
    import or re-export and its module evaluation side effects. The Deno
    module reference enables verbatimModuleSyntax; its default TypeScript
    emitter drops these empty requests."
