title: "Math.sumPrecise"
scope:
  - "The Math.sumPrecise function property, its descriptor, name, length,
    and non-constructor status."
  - "The exact sum of the finite values rounded once with ties to even,
    including subnormal results, cancellation, and overflow to an
    infinity at the binary64 rounding boundary."
  - "The edition's -0, infinity, and NaN state machine, the rejection of
    undefined and null before iteration, the TypeError for every
    non-Number value, and the iterator close that precedes it."
