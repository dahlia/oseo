version: 1
id: harness-well-known-intrinsics
title: "wellKnownIntrinsicObjects.js harness include"
scope:
  - "The reviewed WellKnownIntrinsicObjects table, with every upstream name
    and source string in upstream order and one value per record obtained
    by a statically compiled lookup of that source expression instead of
    the Function constructor, which ADR 0016 keeps outside the profile."
  - "The reviewed getWellKnownIntrinsicObject helper, which returns a
    recorded value, reports an intrinsic the realm does not provide, and
    rejects an unknown name with the upstream failure text."
  - "The one respelled source: because the profile rejects a bare eval
    identifier read, %eval% performs the global object record's
    HasProperty and Get on the Script's top-level this, which is what
    upstream's bare eval resolves to when the Script declares no global
    lexical eval, independent of the globalThis binding. An absent property
    yields undefined, as upstream's discarded ReferenceError does, without
    calling the replaceable ReferenceError global."
  - "The bounded divergence: a non-strict Script's top-level let or const
    named eval, which only an identifier read observes, and a Module, whose
    top-level this is undefined. No consumer of the include at the pinned
    upstream revision is either, and a source test checks every one."
owners:
  - PLAN-M5C.md
