version: 1
id: global-object-record
title: "Standard global value properties and declarations"
scope:
  - "The Infinity, NaN, and undefined value properties and their
    non-writable, non-enumerable, non-configurable descriptors."
  - "Static Script GlobalDeclarationInstantiation checks for restricted
    lexical names, existing var and function properties, and global object
    extensibility, without exposing a globalThis binding."
  - "Bare identifier reads, writes, and deletes for admitted configurable
    constructor globals observe their global-object properties, while global
    declaration failures retain their exact declaration locations."
  - "A bare eval identifier that no declaration or with object supplies
    reads, writes, deletes, and applies typeof to the global object's eval
    property, including through a with fallback; a tagged template with
    that tag is an ordinary call. Direct calls likewise preserve every
    non-String argument unchanged after ordinary argument evaluation.
    Passing a String to %eval% reports the source-located ADR 0016
    runtime boundary; no source is evaluated."
  - "A with object that supplies eval but loses it before GetBindingValue
    reads undefined in non-strict code and throws ReferenceError in strict
    code; the with-statement family owns that lookup contract."
  - "The test262 host compiles a finite literal Script source set ahead of
    time under ADR 0029. Successive Scripts retain realm lexical cells,
    validate all declaration permissions before mutation, preserve completion
    values and thrown identity, and create closures in the evaluated realm.
    Simple immutable lexical evalScript aliases can discover literal sources;
    shadowed, mutable and unproven call targets cannot add candidates.
    Unmatched source and ordinary eval retain the ADR 0016 boundary.
    Runtime-owned console and timer calls honor current Script and with
    bindings before arguments; only an initial miss uses a private intrinsic,
    without installing public intrinsic globals."
  - "A host Script's completion value includes its last directive's cooked
    string, and its own var and function names receive destructuring,
    rest, default and loop-head writes that miss every with object on the
    realm global object's property, as simple and compound writes do. The
    with-hit simple var loop head belongs to with-var-loop-head-resolution."
  - "A host Script's simple var for, for-in and for-of head outside every
    with statement writes through the persistent Global Environment Record,
    so a later Script's lexical declaration captures it and a const one
    throws TypeError. A const declarator in a classic for head is an
    evalScript alias position. A var head inside a with statement belongs
    to with-var-loop-head-resolution."
  - "A Script the realm evaluates before a module graph, as the test262
    harness runs before a module case and the CLI --script option
    provides, is the global environment of every module in that graph.
    Each module, including an imported one, resolves the Script's var,
    function, and lexical declarations by name, while its own declarations
    and imports hide them. Writes to the Script's var and function names
    reach the global object's property, and the Script keeps its own
    strictness. A top-level with statement in that Script whose all-miss
    write could initialize a hidden fallback is rejected with a diagnostic
    located at the Script."
