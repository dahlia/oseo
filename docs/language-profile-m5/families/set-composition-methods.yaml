version: 1
id: set-composition-methods
title: "Set composition methods"
scope:
  - "GetSetRecord over any set-like object: the size read and ToNumber
    conversion, NaN and negative-size rejection, an infinite size, and the
    callable has and keys checks, all after the receiver's Set brand check."
  - "The union, intersection, difference, and symmetricDifference methods,
    including the always-keys walk of union and symmetricDifference, the
    size-selected has or keys branch of intersection and difference, keys
    iterator acquisition, SameValueZero canonicalization, insertion order, and a
    fresh %Set.prototype% result that consults neither species nor add."
  - "The isSubsetOf, isSupersetOf, and isDisjointFrom predicates, including
    early size answers, the size-selected has or keys branch of
    isDisjointFrom, receiver mutation during has calls, and the
    normal-completion iterator close when a keys walk stops early."
