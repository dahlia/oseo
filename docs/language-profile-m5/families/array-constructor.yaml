version: 1
id: array-constructor
title: "Array constructor and statics"
scope:
  - "The realm-owned Array constructor, its length-argument construction,
    prototype identity, and Symbol.species accessor."
  - "Array.from, Array.of, and Array.isArray, including generic constructor
    fallback and iterator-close behavior."
  - "Ordinary array indexed lookup and insertion retain descriptors, holes,
    inherited receivers, mutation, ordering, and generic fallback. Array
    length reduction validates dense configurable data elements before
    tail deletion; unusual layouts keep descending generic deletion.
    Native validation of this expanded M5c source remains pending."
