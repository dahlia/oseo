version: 1
id: iterator-helpers-eager
title: "Eager iterator helpers"
scope:
  - "Iterator.prototype reduce, toArray, forEach, some, every, and find,
    including receiver and callback validation with the underlying-iterator
    close it performs, the single captured next method, the callback counter
    each one passes, the reduce accumulator with and without an initial
    value, the empty-iterator reduce TypeError, the early stop some, every,
    and find perform with a normal-completion close, and the abrupt callback
    close that keeps the original completion."
  - "Reviewed standards coverage is all 173 upstream paths under
    test/built-ins/Iterator/prototype/every/,
    test/built-ins/Iterator/prototype/find/,
    test/built-ins/Iterator/prototype/forEach/,
    test/built-ins/Iterator/prototype/reduce/,
    test/built-ins/Iterator/prototype/some/, and
    test/built-ins/Iterator/prototype/toArray/. Every one of them carries the
    upstream iterator-helpers feature tag, which stays unsupported, so each
    reviewed path records an explicit prerequisite boundary rather than a
    pass. Fixed and generated native differential evidence proves the
    admitted behavior for the same contracts in the meantime."
  - "The measured remaining blockers for that feature tag are outside this
    family. Enabling iterator-helpers over the reviewed Iterator paths leaves
    test/built-ins/Iterator/from/primitives.js,
    test/built-ins/Iterator/from/supports-iterable.js, and
    test/built-ins/Iterator/prototype/flatMap/strings-are-not-flattened.js as
    semantic failures, because all three iterate a String or a String
    wrapper that the unlanded string-iterator node owns, and
    test/built-ins/Iterator/from/get-return-method-when-call-return.js,
    test/built-ins/Iterator/from/return-method-calls-base-return-method.js,
    and
    test/built-ins/Iterator/from/return-method-throws-for-invalid-this.js as
    harness failures, because all three include temporalHelpers.js, which
    the reviewed harness set does not supply."
