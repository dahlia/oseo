version: 1
id: iterator-helpers-eager
title: "Eager iterator helpers"
scope:
  - "Iterator.prototype reduce, toArray, forEach, some, every, and find,
    including receiver and callback validation with the underlying-iterator
    close it performs, the single captured next method, the callback counter
    each one passes, the reduce accumulator with and without an initial
    value, the empty-iterator reduce TypeError, the early stop some, every,
    and find perform with a normal-completion close, and the abrupt callback
    close that keeps the original completion."
  - "Reviewed standards coverage is all 173 upstream paths under
    test/built-ins/Iterator/prototype/every/,
    test/built-ins/Iterator/prototype/find/,
    test/built-ins/Iterator/prototype/forEach/,
    test/built-ins/Iterator/prototype/reduce/,
    test/built-ins/Iterator/prototype/some/, and
    test/built-ins/Iterator/prototype/toArray/. The IH-A focused precheck
    observes all 173 as pass after admitting iterator-helpers. Its raw
    inputs and observations are recorded in
    docs/m5c-graph/iterator-helpers-tag-activation.md. The accepted full
    UPDATE on U a678c85e records these method paths as pass. String
    iteration and the bounded Iterator.from primitive repair remove the
    historical String blockers; temporalHelpers.js
    remains unadmitted and its three paths belong to IH-B."
