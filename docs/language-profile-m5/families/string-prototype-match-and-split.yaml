version: 1
id: string-prototype-match-and-split
title: "String prototype match and split methods"
scope:
  - "String.prototype.match, matchAll, search, and split, including receiver
    coercion, well-known-symbol dispatch, split limits, match metadata, and
    dedicated matchAll iteration."
  - "An Object operand receives the applicable symbol lookup, and a callable
    method is called with the original receiver and, for split, the original
    limit. matchAll first applies IsRegExp and requires a global flags value
    for a true result."
  - "A nullish method, a primitive operand, and a missing operand take the
    method's own tail. For match, matchAll, and search that tail is
    RegExpCreate and Invoke, admitted by regexp-symbol-methods, which
    replaced this node's fixed-width fallback pattern language. split keeps
    the code-unit separator search the specification gives it."
  - "RegExp objects, flags, pattern compilation, and the symbol methods
    themselves remain owned by the regexp nodes."
