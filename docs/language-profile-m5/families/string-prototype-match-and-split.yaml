version: 1
id: string-prototype-match-and-split
title: "String prototype match and split methods"
scope:
  - "String.prototype.match, matchAll, search, and split, including receiver
    coercion, well-known-symbol dispatch, literal String fallbacks, split
    limits, match metadata, and matchAll iteration."
  - "RegExp pattern compilation and RegExp object symbol methods remain owned
    by regexp-symbol-methods. The two inventory cases whose null protocol
    method falls through to a dynamically produced \\d pattern use the fixed
    and generated null-method literal evidence until that node lands."
