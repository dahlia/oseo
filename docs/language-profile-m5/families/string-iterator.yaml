version: 1
id: string-iterator
title: "String iterator"
scope:
  - "String.prototype Symbol.iterator and the materialized
    %StringIteratorPrototype%, including method metadata, descriptors,
    prototype ancestry, branding, permanent exhaustion, and traversal by
    Unicode code point while preserving lone surrogate code units."
  - "Array binding and assignment patterns in a for-in head, whose String
    keys now destructure through the ordinary iterator protocol."
  - "The node inventory contains 13 applicable paths under
    test/built-ins/String/prototype/Symbol.iterator/ and
    test/built-ins/StringIteratorPrototype/, all promoted into the reviewed
    manifest as passes. Six reviewed test/language/statements/for-in/ paths
    outside those roots move from unsupported-profile-feature to pass because
    their array-pattern heads are now admitted."
