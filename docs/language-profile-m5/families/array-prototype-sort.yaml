version: 1
id: array-prototype-sort
title: "Array prototype sorting"
scope:
  - "Array.prototype sort and toSorted, including comparator validation
    before receiver conversion, SortIndexedProperties over sparse and
    generic receivers, hole and undefined ordering, comparator result
    coercion, stability, abrupt completion order, mutation observability,
    write-back and trailing deletion, and the plain-Array copy toSorted
    allocates without consulting Symbol.species."
  - "All 75 upstream sorting paths are reviewed, including the unchanged
    test/built-ins/Array/prototype/sort/stability-2048-elements.js.
    Dense backend storage identities exclude non-value safepoint, status,
    and root annotations from the native frame allocation. The existing
    65,536-slot active frame budget remains unchanged; values keep separate
    rooted slots throughout the frame. Fixed 2,048- and 4,096-element
    literal fixtures and generated 2,048-to-4,096-element bucket orderings
    verify complete stable order and element identity under both policies,
    deliberate guard fallback, and forced collection."
  - "Generated large literals use normal collection in the unchanged
    two-case, 180-second ordinary property budget. Forced collection at
    every safepoint during 2,048-element construction and sorting is pinned
    in tests/native.ts under both policies; the 4,096-element fixture uses
    normal collection. The pinned runner has no per-fixture timeout; the
    sanitizer native CI job has a 75-minute limit. Forced instrumentation
    costs about 80 CPU seconds per 2,048-element execution."
  - "Callable entries retain conservative logical frame charges
    separately from dense heap roots: unoptimized sanitizer expression
    temporaries consume C stack space. Script entries cannot recurse and
    charge their compact physical layout. The unchanged wide-recursion
    resource scenario and a 1,000-binding regression under both policies
    keep reporting OSEO2001 before C stack exhaustion."
owners:
  - PLAN-M5.md
