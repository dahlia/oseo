version: 1
id: array-prototype-sort
title: "Array prototype sorting"
scope:
  - "Array.prototype sort and toSorted, including comparator validation
    before receiver conversion, SortIndexedProperties over sparse and
    generic receivers, hole and undefined ordering, comparator result
    coercion, stability, abrupt completion order, mutation observability,
    write-back and trailing deletion, and the plain-Array copy toSorted
    allocates without consulting Symbol.species."
  - "Reviewed standards coverage is 74 of the 75 upstream paths under
    test/built-ins/Array/prototype/sort/ and
    test/built-ins/Array/prototype/toSorted/. The omitted path,
    test/built-ins/Array/prototype/sort/stability-2048-elements.js, builds a
    2,048-element array literal that exceeds the documented 32,768 root-slot
    native frame budget before any sorting runs, so it observes a resource
    boundary rather than a sorting contract. Its stability contract is
    covered instead by the eleven-element duplicated-key orderings in
    tests/native/fixtures/array-prototype-sort.ts and by the generated
    orderings across both merge shapes in
    tests/property/m5-array-prototype-sort.property.test.ts."
owners:
  - PLAN-M5.md
