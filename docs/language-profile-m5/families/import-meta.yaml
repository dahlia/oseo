    reason: "A read has no input domain: it names its module's one hidden
      binding whatever values flow around it, and every enclosing function
      reaches that binding through the same module-level capture. The fixed
      tests cover reads from the module body, an arrow, a function, a class
      field and method, a generator, an async function, an async arrow, an
      async generator, and after top-level await, plus the cyclic read
      before module evaluation, nineteen non-target uses, and the rejected
      goals and target positions, instead of sampling them."
    replacements:
