version: 1
id: import-meta
title: "import.meta in Module code"
scope:
  - "import.meta in Module code, at any depth of function, arrow, class,
    generator, or async nesting, evaluates to one object per module. The
    module compiler creates it before any module function initializer, so
    a hoisted function that a cyclic dependency calls before its module
    evaluates reads the same object as the module body."
  - "The object is ordinary and extensible, its [[Prototype]] is null, and
    it has no own properties: the closed module host defines no
    HostGetImportMetaProperties entries and no HostFinalizeImportMeta
    step. Calling or constructing it throws TypeError through the generic
    call and construct paths."
  - "import.meta in Script code, an escaped import or meta, another meta
    property name after import, and import.meta in any assignment, update,
    destructuring, or for-in/of target position are early SyntaxErrors
    located at the offending token. eval and Function source text keeps
    its ADR 0016 boundary."
owners:
  - PLAN-M5.md
  - docs/adr/0009-module-identity-and-linking.md
