version: 1
id: compound-assignment
title: "Compound assignment"
scope:
  - "Arithmetic and logical compound assignment to references."
  - "An arithmetic compound assignment to an ordinary computed or named
    member, base[key] op= value for all twelve arithmetic, exponentiation,
    bitwise, and shift operators, follows ECMA-262 2025 GetValue and
    PutValue: a null or undefined base throws TypeError before the key is
    converted or the right operand runs, and the key is converted once and
    reused by the write. Both measured V8 hosts convert the key again before
    the write; that discrepancy is recorded against fixed expected values."
  - "Every other computed member Reference follows the same ECMA-262 2025
    order: plain reads and method lookup, logical member assignment, simple
    member assignment after its right operand, prefix and postfix update,
    super[key] references, plain links inside an optional chain, and for-in
    and for-of head member targets, and computed super array and object
    destructuring targets check the base before converting the key
    once, and a write reuses the converted key. A nullish base with a key
    other than a primitive literal reports the assignment-target TypeError
    message. Global identifier references keep their literal-name lowering.
    Both measured V8 hosts convert a written key again and convert a super
    key before a null home prototype throws; those discrepancies are
    recorded against fixed expected values."
  - "A simple or logical assignment applies NamedEvaluation to an anonymous
    function, arrow, or class only when IsIdentifierRef of its target is
    true, as ECMA-262 2025 13.15.2 requires. A parenthesized identifier
    target, as in (f) = function () {}, is a ParenthesizedExpression, so the
    value keeps an empty name; the bare target still names it. Lexical, var,
    implicit global, and with fallback bindings follow the same rule, and the
    reference, evaluation order, and write are unchanged."
