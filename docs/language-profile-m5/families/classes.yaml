version: 1
id: classes
title: "Class definitions"
scope:
  - "Basic class declarations, expressions, methods, and strict bodies."
  - "A second non-static constructor definition is a source-located OSEO0001
    early error in class declarations and expressions, in Script and Module
    goals, checked over the whole class body after the class-header checks and
    before the heritage or any element converts, so unsupported syntax in an
    earlier member, the first constructor body or the heritage cannot mask it.
    Class-header rejections (generic parameters, TypeScript modifiers and
    implements clauses, decorators, a missing name or body) keep OSEO1001.
    Static methods and computed constructor-named members retain their
    permitted roles. Rejection occurs before syntax IR, HIR, MIR,
    specialization or native execution; it creates no runtime value or
    collection point. Existing class runtime evidence covers the valid
    definitions, while frontend and invalid-generator evidence covers the
    rejection contract."
