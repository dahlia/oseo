version: 1
id: weak-collections
title: "Weak collections and finalization"
scope:
  - "The WeakMap, WeakSet, WeakRef, and FinalizationRegistry constructor and
    prototype pairs, including their realm-global, name, length, prototype,
    constructor, method, and Symbol.toStringTag descriptors, new-target
    prototype selection, and brand checks."
  - "CanBeHeldWeakly over objects and unregistered symbols, address-indexed
    WeakMap and WeakSet membership backed by collector ephemerons, observable
    adder lookup and iterator closing during construction, and deletion that
    stays synchronized with collector unlinking."
  - "WeakRef construction and deref with the job-scoped KeptAlive set, and
    FinalizationRegistry register and unregister with weak targets and
    tokens, one cleanup job per registry scheduled by the event loop in
    collector queue order, and removal of records that were already queued."
owners:
  - PLAN-M5.md
  - PLAN-GC.md
