version: 1
id: object-prototype
title: "Object prototype"
scope:
  - "The realm-owned %Object.prototype% as the default ordinary-object
    prototype."
  - "hasOwnProperty, isPrototypeOf, propertyIsEnumerable, toString,
    toLocaleString, valueOf, and constructor."
  - "Core reflection exposes stable, distinct realm-owned native identities
    for the excluded __proto__ getter and setter. Describing, comparing,
    copying or redefining them does not invoke their bodies; invocation of
    an excluded half reports source-located OSEO1001. Partial replacement,
    explicit undefined halves, deletion/recreation, integrity operations
    and Proxy invariants retain ordinary descriptor behavior."
  - "Primitive [[Set]] uses full wrapper lookup with the original primitive
    Receiver, including inherited setter and Proxy dispatch, String own
    restrictions and strict/sloppy refusal. User accessor halves, ordinary
    properties, null prototypes, proxy traps, typed-array numeric keys and
    the object-literal prototype setter retain their core behavior."
  - "A missing __lookupGetter__ or __lookupSetter__ read reaching an
    intrinsic Object.prototype reports OSEO1001 for the omitted normative
    optional legacy method (16th edition 20.1.3.9, mapped onto the ADR 0013
    Annex B policy by ADR 0020); user properties and methods with those
    names, null prototypes, proxy traps, reflection, and unrelated
    TypeErrors retain core behavior."
