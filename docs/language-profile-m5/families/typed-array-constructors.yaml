version: 1
id: typed-array-constructors
title: "TypedArray constructors"
scope:
  - "The abstract %TypedArray% constructor and twelve concrete constructor
    and prototype pairs, including their realm-global, name, length,
    prototype, constructor, and BYTES_PER_ELEMENT descriptors."
  - "Construction from an element length, ArrayBuffer with byte offset and
    optional element length, iterable, array-like object, or TypedArray,
    including Number, BigInt, clamped, integer, and floating conversion."
  - "Float16Array stores round once from binary64 to binary16 with ties to
    even through the encoder DataView's setFloat16 uses, so both views of
    one buffer agree bit for bit; Atomics rejects a Float16Array."
  - "The ViewedArrayBuffer ownership and collector edge, indexed reads and
    writes needed to observe constructor results, ArrayBuffer.isView, new
    target prototype selection, and Number-versus-BigInt content rejection."
  - "The remaining integer-indexed exotic descriptor surface, prototype
    accessors and methods, static from and of methods, and species behavior
    are omitted here, retain their later M5b graph owners, and have explicit
    runtime lookup boundaries."
  - "TypedArray-to-TypedArray cloning ignores an ArrayBuffer subclass
    constructor and species; the fresh buffer has the intrinsic ArrayBuffer
    prototype and constructor, observed through core reflection."
  - "Construction order: an undefined new target throws first; a primitive
    first argument runs ToIndex before the new target's prototype read, and
    zero arguments and every object source read that prototype before any
    argument conversion, iteration, or element read."
owners:
