version: 1
id: promise-resolve-constructor-read
title: "PromiseResolve constructor read"
scope:
  - "PromiseResolve reads the constructor property of a native Promise value
    through ordinary property access before deciding whether to reuse that
    value. A matching constructor returns the value unchanged, a different
    constructor produces a fresh capability, and an abrupt getter propagates
    without creating that capability."
  - "Values that are not native Promise objects do not receive the constructor
    read. They continue through NewPromiseCapability and ordinary thenable
    assimilation, including a thenable with a poisoned constructor getter."
  - "The rule applies to Promise.resolve, derived Promise constructors,
    Promise combinators, Promise.prototype.finally, await, asynchronous
    generators, and asynchronous-from-synchronous iterator continuations
    through their shared PromiseResolve operation."
