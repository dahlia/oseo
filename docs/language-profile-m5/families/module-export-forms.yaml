version: 1
id: module-export-forms
title: Module export forms and arbitrary module namespace names
scope:
  - "export var exports every BoundName of its VariableStatement, including
    declarators without an initializer and binding-pattern leaves. Every
    module var cell is created as undefined while linking, so a cyclic
    importer or hoisted function reads undefined before the declaring
    module evaluates; source initializers keep their evaluation position,
    and let, const, and class bindings keep their temporal dead zones."
  - "export * as name from a module exports that module's one namespace
    object under an explicit name, including default and a string name.
    It shares the namespace cell used by import * as and by re-exporting a
    namespace import, so star exports reaching it from several paths stay
    unambiguous while distinct namespaces under one name stay ambiguous."
  - "Import, export, and re-export names may be any well-formed string. The
    string name * is an ordinary export name and never selects a namespace
    import. Duplicate export names, lone surrogates, and a string local
    name without from are early errors."
  - "A module namespace lists its string keys in the code-unit order of its
    export names, array-index names such as 2 and 10 included, then
    @@toStringTag. Own-key queries, Object.assign, and spread and rest
    copies use that order; ordinary objects keep array-index keys first in
    ascending numeric order. ECMA-262 leaves for-in order over a namespace
    unspecified, and Oseo chooses the same order."
  - "ECMAScript import and export declarations are ModuleItems, never
    Script statements, including nested positions. Script placement errors
    report source-located OSEO0001 before unsupported conversion. The
    Module frontend accepts valid top-level forms and rejects nested ones.
    Type-only forms, including star exports, and unsupported TypeScript
    namespaces and ambient modules retain OSEO1001; no erasure is added."
owners:
