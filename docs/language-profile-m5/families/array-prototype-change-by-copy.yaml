version: 1
id: array-prototype-change-by-copy
title: "Array prototype change by copy"
scope:
  - "Array.prototype with, toSpliced, and toReversed, including receiver and
    length conversion, relative-index and splice-argument coercion, immutable
    source handling, omitted and explicit splice arguments, dense copies of
    sparse or inherited values, snapshot length with observable indexed reads,
    abrupt completion, and plain-Array allocation that never consults
    constructor or Symbol.species."
  - "Reviewed standards coverage is all 68 upstream paths under
    test/built-ins/Array/prototype/toReversed/,
    test/built-ins/Array/prototype/toSpliced/, and
    test/built-ins/Array/prototype/with/: 65 pass and three retain the
    separately owned Boolean intrinsic prerequisite."
