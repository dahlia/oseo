    reason: "The node has no inventory root and moves no reviewed row: the
      reviewed corpus contains no runtime negative whose thrown value is not
      a recognized intrinsic error. Its standards contract is the runner's
      negative classification path, which is proved directly."
    replacements:
      - tests/test262-runner.test.ts
  structural:
    status: omitted
    reason: "The node adds no IR construct, generated-C shape, or realm
      intrinsic; its contract is the exact stderr the native host writes and
      the terminal-marker rule the test262 runner applies to that stderr. A
      fixture observation never carries a marker, because the runtime writes
      one only on the failure path and a failed execution is rejected before
      it becomes an observation, so the fixture reader leaves a
      marker-shaped line alone."
