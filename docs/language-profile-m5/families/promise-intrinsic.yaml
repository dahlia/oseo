version: 1
id: promise-intrinsic
title: "%Promise% as a materialized intrinsic value"
scope:
  - "The realm-owned Promise constructor, its global object property, its
    call and construct behavior, and the prototype it takes from a new
    target."
  - "Promise.prototype's constructor link, Symbol.toStringTag, then, catch,
    and finally, including SpeciesConstructor and the PromiseCapability
    record a foreign constructor produces."
  - "The Symbol.species accessor and the resolve, reject, withResolvers, and
    try statics with their receiver and capability semantics."
