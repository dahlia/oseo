version: 1
id: set-intrinsic
title: "Set and its iterators"
scope:
  - "Set construction from an iterable through its observable add method,
    iterator closing after an abrupt add, and derived-constructor prototype
    selection."
  - "Insertion-ordered element storage with SameValueZero identity, deletion
    tombstones, re-insertion at the end, and live mutation semantics for
    iteration and forEach."
  - "The add, clear, delete, entries, forEach, has, keys, size, and values
    prototype APIs, %SetIteratorPrototype%, Symbol.iterator,
    Symbol.toStringTag, and Symbol.species."
