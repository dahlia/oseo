version: 1
id: with-statement
title: "With statements"
scope:
  - "Non-strict with object environments and dynamic name lookup, including
    Symbol.unscopables lookup, object-only blocking records, truthy blocking,
    mutation during lookup, and abrupt completion order. This family owns the
    dynamic lookup contract; intrinsic unscopables objects remain with their
    owning built-in families."
  - "Simple, compound, logical, and update assignments retain the selected
    Object Environment Record across RHS evaluation and coercion. Strict
    SetMutableBinding throws ReferenceError if HasProperty now misses;
    non-strict SetMutableBinding still writes the retained object. Class
    code, including a heritage operand, computed key, static block, static
    field initializer, or static method, is strict even inside sloppy code
    and applies the same strict checks."
  - "Strict all-miss simple, destructuring, for-in, and for-of writes to
    the runtime-owned call targets console, setTimeout, and clearTimeout
    remain source-located rejections: their hidden cells cannot model
    strict PutValue."
  - "Existing array/object assignment leaves and for-in/of binding heads
    with a real lexical fallback preserve strict SetMutableBinding when
    object lookup selects a binding deleted by unscopables. Initial misses
    still write the lexical fallback."
  - "Keyed object pattern identifier leaves, in var declarations and
    destructuring assignments, resolve before GetV and the default
    initializer and write the selection made then. Array element, array
    rest, and object rest preparation order remains outside this unit and
    is tracked as a separate source-based concern."
