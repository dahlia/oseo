version: 1
id: bigint-intrinsic
title: "BigInt intrinsic, prototype, and fixed-width conversions"
scope:
  - "The callable %BigInt% intrinsic with a [[Construct]] slot that always
    throws before conversion, its name, length, prototype link, and property
    descriptors; its ToPrimitive
    ordering, exact integral-Number branch, and shared ToBigInt
    conversion over Boolean, BigInt, and candidate-edition string
    grammar; and the specified TypeError, RangeError, and SyntaxError
    completions in their specified order."
  - "BigInt.asIntN and BigInt.asUintN, including ToIndex width handling
    before operand conversion, exact modulo-2**bits truncation for both
    signings, and method metadata."
  - "%BigInt.prototype% as an ordinary object with no [[BigIntData]]
    slot, its constructor and Symbol.toStringTag properties, and
    toString, toLocaleString, and valueOf with one thisBigIntValue brand
    check admitting a BigInt primitive or a BigInt wrapper object, radix
    bounds and conversion, and their descriptors, names, and lengths."
  - "BigInt wrapper objects created through Object, whose ordinary
    ToPrimitive reaches these prototype methods, while the BigInt
    storage itself acquires no object identity."
  - "A width whose unsigned result would cross ADR 0023's reviewed
    65,536-bit magnitude ceiling throws a catchable RangeError before
    allocating. A bounded allocation-attempt sweep covers result publication,
    Number-to-BigInt, every radix staging buffer, wrapper creation, and partial
    intrinsic-cluster initialization. Each failure reports the owned
    non-catchable OSEO2001 diagnostic without partial publication, then cleanup,
    collection, retry, stable intrinsic identity, and complete publication are
    verified. These are Oseo's own resource boundaries rather than specified
    ones, so their evidence is direct native observation instead of a
    reference-host comparison."
  - "The throwing [[Construct]] slot makes IsConstructor(BigInt) true for
    class heritage and generic Array.from and Array.of construction while
    direct and derived construction reject before argument conversion.
    Reflect.construct remains unadmitted, so reviewed cases requiring that
    separate namespace retain explicit boundaries."
