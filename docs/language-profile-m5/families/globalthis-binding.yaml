version: 1
id: globalthis-binding
title: "globalThis binding and global-object name resolution"
scope:
  - "The realm global object exposed as its own writable, non-enumerable,
    configurable globalThis property."
  - "Known globals keep their property-backed cells; every other unresolved
    global reference resolves through the realm global object at run time,
    including typeof, delete, sloppy and strict writes, and all-miss with
    reads and non-strict writes."
  - "The unresolvable-reference ReferenceError, the rejection boundary for an
    intrinsic error reason, and the test262 host-binding and
    harness-definition capability classifications."
