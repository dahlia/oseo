version: 1
id: optional-chaining
title: "Optional chaining"
scope:
  - "Optional property, computed, and call chains."
  - "An optional call outside tail position whose callee is an identifier
    resolved through a selected with Object Environment Record, such as
    f?.() inside with, keeps the callee's Reference and receives
    WithBaseObject as this: the selected object, or undefined for a
    lexical or global fallback. Node with-optional-call-receiver-non-tail
    admits it, recorded in
    docs/m5c-graph/with-optional-call-receiver-non-tail.md. Member-call
    receivers are unchanged."
  - "Known remaining gap: strict tail-position optional calls through with,
    such as return f?.() in a strict function nested in a with body. Active
    node with-optional-call-receiver-tail owns their evidence, and the
    umbrella with-optional-call-receiver, recorded in
    docs/m5c-graph/with-optional-call-receiver.md, blocks m5-exit-audit
    until it lands. This record claims no tail-position receiver behavior
    through with."
