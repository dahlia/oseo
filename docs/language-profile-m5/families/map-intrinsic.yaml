version: 1
id: map-intrinsic
title: "Map intrinsic"
scope:
  - "The realm-owned %Map% constructor, its standard writable,
    non-enumerable, configurable global property, and the ordinary
    construction and iterable-consuming AddEntriesFromIterable behavior
    it runs instead of a frontend fast path."
  - "SameValueZero-keyed [[MapData]] storage with insertion order and
    in-place tombstone deletion, and %Map.prototype%'s get, set, has,
    delete, clear, forEach, entries, keys, values, size, constructor,
    Symbol.iterator, and Symbol.toStringTag own properties."
  - "The Symbol.species accessor and the groupBy static, which builds
    directly into a fresh map's records rather than through an
    observable set lookup."
  - "%MapIteratorPrototype% and CreateMapIterator, including its
    Symbol.toStringTag and receiver branding."
