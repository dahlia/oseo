version: 1
id: destructuring-assignment
title: "Destructuring assignment"
scope:
  - "Recursive array and object assignment patterns."
  - "A keyed identifier leaf of an object assignment pattern inside with
    evaluates its reference after the property key and before GetV and
    the default initializer. Sloppy and strict PutValue use the reference
    selected then: the Object Environment Record that holds the binding
    or, when every object environment misses, the enclosing declarative or
    global binding."
  - "An AssignmentElement initializer is named after its target only when
    IsIdentifierRef of the DestructuringAssignmentTarget is true, as
    ECMA-262 2025 13.15.5.5 requires. A parenthesized identifier target, as
    in [(f) = function () {}] = [], leaves an anonymous value unnamed in
    array and object patterns; the bare target and the shorthand property
    still name it."
