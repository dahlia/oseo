version: 1
id: string-prototype-replace
title: "String prototype replacement methods"
scope:
  - "String.prototype.replace and replaceAll, including receiver coercion,
    Symbol.replace dispatch for an Object operand, functional and String
    replacers, GetSubstitution replacement tokens, replaceAll's IsRegExp and
    global-flag requirement, its nonoverlapping match list and empty-search
    advancement, and the receiver, search, and replacer conversion order."
  - "Both methods observe an operand only when it is an Object, so a
    primitive search value reaches no Symbol.replace lookup, IsRegExp
    observation, or flags read. The pinned Node.js host still performs that
    lookup, so the reviewed test262 cases under the node's inventory roots
    carry the observation instead of the fixed differential fixture."
  - "GetSubstitution runs with an empty capture list and an undefined
    named-capture object, which is what both callers supply. `$$`, `` $` ``,
    `$&`, and `$'` substitute; `$1` through `$99` and `$<name>` have no
    referent and copy their reference text unchanged."
  - "RegExp objects, their patterns and flags, and the Symbol.replace method
    a RegExp supplies remain owned by the regexp nodes. Reviewed cases that
    need one keep an explicit prerequisite boundary rather than receiving a
    literal approximation."
