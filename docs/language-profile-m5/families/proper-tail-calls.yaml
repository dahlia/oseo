version: 1
id: proper-tail-calls
title: "Proper tail calls"
scope:
  - "Calls in tail position of strict ordinary, arrow, method, accessor, and
    class constructor bodies, including the existing direct console.log,
    setTimeout, and clearTimeout host targets, and the PrepareForTailCall
    steps of Function.prototype.call, Function.prototype.apply, and
    Reflect.apply."
  - "Bound function and Proxy [[Call]] forwarding through the same
    trampoline, derived constructor result rules after a tail call, and
    the realm of errors a tail call raises."
  - "Historical integration ported complete TCO 9945b7b8 to b1eaeff0 onto
    Array Ucccb7195, preserving all thirteen Array paths, three runtime
    guard hunks, six coverage files and its source-qualified worknote.
    Set Receiver, descriptor, invariant, locator and corrected state prose
    stay inherited. Main chunks/include units and all fifteen TCO product
    postimages remain exact b1eaeff0. Array apply/Set/coercion/truncation/GC
    interactions have current-source focused execution and the full
    reviewed-corpus observation on U68e298a9, as recorded below.
    Earlier a111c31e failed its native locator; 54973309, e88f05cb/1a305507
    and b1eaeff0/33 remain preserved with their exact sources and outcomes.
    At initial preparation Main was cf0902db/54; Set55 was prospective
    and the standalone Array Full excluded TCO. Those are historical
    preparation identities, not the later combined-source observations.
    Main TCO 145819bd and Set U071/R868 evidence retain their own sources.
    Array f8f3e2de structural proofs and Array 353a9f17 execution remain
    historical with their source, framework, target, policy and GC limits.
    Six focused author vectors and the full reviewed corpus ran on
    68e298a9a96a6d22dc2e33b9e70b7c6a86720e41, tree
    dcca1b0bf57b63d0446fab54c676f42a2ca19739. The Full observed only the
    two owned strict tagged-template promotions. Historical Native935
    belongs to 05c1f074. These observations supply no candidate/Main gate
    pass; the admission data gate requires the actual result and review."
  - "Current source preparation carries final f5bdd44d compiler/runtime,
    programs, assertions and stable generators onto Reg publication candidate
    98460f7c. Reg observations, all per-path expectations and ledger owners
    remained exact that candidate at preparation, without promoting the two
    TCO expectations. The source list admits tail-call-optimization. Earlier
    U68 and f5 evidence keeps its exact source and scope in the evidence
    contract."
  - "The later Full on accepted U e2dba363, tree add0cbfc, observed all
    29,901 reviewed paths and promoted exactly the two owned strict
    tagged-template paths from unsupported to pass, with no demotion. It is
    no candidate/Main gate pass and no macOS execution."
