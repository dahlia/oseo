version: 1
id: array-prototype-mutation
title: "Array prototype mutation"
scope:
  - "Array.prototype push, pop, shift, unshift, splice, fill, copyWithin,
    and reverse, including receiver and length conversion, relative-index
    conversion, maximum-safe-integer checks, length updates, sparse and
    inherited indexed properties, overlap direction, species construction,
    and abrupt completion order."
  - "Reviewed standards coverage is 247 of the 249 upstream paths under
    test/built-ins/Array/prototype/copyWithin/,
    test/built-ins/Array/prototype/fill/,
    test/built-ins/Array/prototype/pop/,
    test/built-ins/Array/prototype/push/,
    test/built-ins/Array/prototype/reverse/,
    test/built-ins/Array/prototype/shift/,
    test/built-ins/Array/prototype/splice/, and
    test/built-ins/Array/prototype/unshift/. The reviewed paths contain
    223 passes and 24 explicit prerequisite boundaries. Two paths require
    the unavailable proxyTrapsHelper.js include and have fixed and generated
    replacement evidence for their large-length contracts."
