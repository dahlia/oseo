version: 1
id: class-private-elements
title: "Private instance elements"
scope:
  - "Private fields, methods, accessors, brands, and optional reads."
  - "Private-name creation initializes a fresh lexical cell in one bounded
    runtime call. Intermediate roots end at its return; earlier class
    evaluations retain their captured cells and private identities.
    Runtime ABI m5-142 adds this entry point without changing native frame
    limits, general binding-access charges, or specialization policies."
