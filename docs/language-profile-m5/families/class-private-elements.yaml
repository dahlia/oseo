version: 1
id: class-private-elements
title: "Private instance elements"
scope:
  - "Private fields, methods, accessors, brands, and optional reads."
  - "Private-name creation initializes a fresh lexical cell in one bounded
    runtime call. Intermediate roots end at its return; earlier class
    evaluations retain their captured cells and private identities.
    Runtime ABI m5-142 adds this entry point without changing native frame
    limits, general binding-access charges, or specialization policies."
  - "Installing a private getter or setter creates no public own property
    or public-name membership. Ordinary private reads and setter effects
    remain observable without legacy accessor lookup. The replacement
    fixtures of each class form witness every core subject of the two
    class expression paths and the two class declaration paths of the
    same names, which the 2026-11-01 and 2026-11-02 maintainer decisions
    close as ADR 0013 exclusions; they do not count those unsupported
    paths as passes."
owners:
  - PLAN-M5.md
