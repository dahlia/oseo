version: 1
id: class-private-elements
title: "Private instance elements"
scope:
  - "Private fields, methods, accessors, brands, and optional reads."
  - "Installing a private getter or setter creates no public own property
    or public-name membership. Ordinary private reads and setter effects
    remain observable without legacy accessor lookup. The replacement
    fixtures do not count the two unsupported upstream paths as passes
    or authorize whole-path exclusion."
