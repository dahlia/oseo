version: 1
id: array-buffer
title: "ArrayBuffer"
scope:
  - "ArrayBuffer construction, call-versus-construct behavior, ToIndex
    length conversion, the maxByteLength option and its abrupt order, and
    the Data Block one buffer owns across collection, resize, transfer,
    and destruction."
  - "The byteLength, detached, maxByteLength, and resizable accessors,
    their branding, and the resize, slice, transfer, and
    transferToFixedLength prototype methods with their SpeciesConstructor,
    detached-state, and bounds rules."
  - "ArrayBuffer.isView, the Symbol.species accessor, the Symbol.toStringTag
    tag, and the own-property descriptors of the constructor, the
    prototype, and the realm global property."
