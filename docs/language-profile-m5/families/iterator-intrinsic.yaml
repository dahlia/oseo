version: 1
id: iterator-intrinsic
title: "Iterator intrinsic"
scope:
  - "The realm-owned %Iterator% and %IteratorPrototype%, including their
    standard descriptors and prototype links."
  - "Iterator.from and the wrap-for-valid-iterator object used by iterator
    helper methods. Iterator.from accepts a String primitive through
    GetV and calls its iterator method with that primitive receiver;
    other primitives retain TypeError. The fixed fixture observes replaced,
    non-callable and abrupt String iterator lookups. The existing generated
    domain also covers bounded strings with paired and lone surrogates,
    preserving its seed and 12-case budget. IH-A precheck evidence and the
    four remaining unsupported paths are recorded in
    docs/m5c-graph/iterator-helpers-tag-activation.md; the accepted full
    manifest UPDATE on U a678c85e confirms 389 promotions and four
    unsupported paths. IH-B admits a reviewed temporalHelpers.js subset for
    three of them; its focused precheck, recorded in
    docs/m5c-graph/temporal-helpers-harness.md, observed them as pass,
    and the accepted full manifest UPDATE on U 6c0d46bd promotes exactly
    those three paths to pass with no demotions."
