version: 1
id: typed-array-iterative
title: "TypedArray iteration methods"
scope:
  - "The %TypedArray.prototype% every, some, forEach, map, filter, reduce,
    and reduceRight methods: ValidateTypedArray before the callable check and
    the length snapshot, one TypedArrayGetElement read per snapshot index
    with no hole test, detach and shrink observations taken while a callback
    runs, every and some short-circuit results, the forEach undefined result,
    the TypedArraySpeciesCreate allocation map performs before its first
    callback and filter performs after it collects, the content-type and
    result-length checks on the species result, and the reduce and
    reduceRight accumulator selection when no initial value is supplied."
  - "Reviewed standards coverage is every upstream path under the node's
    seven inventory roots: test/built-ins/TypedArray/prototype/every,
    filter, forEach, map, reduce, reduceRight, and some. Paths that need
    ArrayBuffer.prototype.transferToFixedLength or the unreviewed
    resizableArrayBufferUtils.js include retain explicit boundaries."
