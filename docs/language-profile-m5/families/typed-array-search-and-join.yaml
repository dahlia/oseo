version: 1
id: typed-array-search-and-join
title: "TypedArray search and joining"
scope:
  - "The %TypedArray.prototype% find, findIndex, findLast, findLastIndex,
    includes, indexOf, lastIndexOf, join, and toLocaleString methods and the
    shared toString identity: ValidateTypedArray before the length snapshot,
    the predicate callable check, one TypedArrayGetElement read per visited
    snapshot index, the empty-view answer before the fromIndex conversion,
    the ToIntegerOrInfinity fromIndex clamps, SameValueZero for includes and
    strict equality with a HasProperty test for indexOf and lastIndexOf, the
    separator conversion after the snapshot, the ECMA-262 toLocaleString
    element call with no arguments, which M5c node
    typed-array-tolocalestring-arguments restored in place of ECMA-402
    locale and options forwarding, and the detach, shrink, and grow
    observations a predicate or conversion causes."
  - "Reviewed standards coverage is every upstream path under the node's ten
    inventory roots: test/built-ins/TypedArray/prototype/find, findIndex,
    findLast, findLastIndex, includes, indexOf, join, lastIndexOf,
    toLocaleString, and toString. The reviewed
    resizableArrayBufferUtils.js include is observed: 27 of the 29 paths
    in these roots using it pass, and the two user-provided-tolocalestring
    grow and shrink cases
    remain unsupported with active owner primitive-wrapper-objects."
