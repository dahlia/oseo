version: 1
id: promise-allsettled-and-any
title: "Promise.allSettled and Promise.any"
scope:
  - "Promise.allSettled result records in input order, with status followed by
    value or reason as ordinary own data properties and one shared first-call
    guard for each element's two settlement closures."
  - "Promise.any fulfillment by the first fulfilled input and AggregateError
    rejection with an input-ordered errors array when every input rejects,
    including the empty input."
  - "NewPromiseCapability from the receiver, one observable resolve read,
    per-element resolve calls, iterator closing, subclass behavior, and abrupt
    completion shared with the other iterable promise combinators."
