version: 1
id: primitive-wrapper-objects
title: "Primitive wrapper call bindings and ToObject receivers"
scope:
  - "One fresh Boolean, Number, String, Symbol, or BigInt wrapper per
    non-strict call, with the existing primitive value and brand."
  - "Repeated this reads, parameter defaults, lexical captures, call
    forwarding, and suspension preserve the bound receiver's identity."
  - "Array.from array-like reads and Object.prototype.toString tag reads
    use their actual ToObject result; GetV retains primitive receivers."
  - "The forty-path selector is fixed in the focused standards fixture.
    Canonical reviewed observations remain unsupported until the later
    complete UPDATE; focused evidence is not a compatibility promotion."
  - "Node.js and Deno expose primitive receivers to strict toStringTag
    getters in Object.prototype.toString. The tests retain a labeled V8
    model separately from ECMA-262 2025 steps 3 and 15."
  - "Primitive inherited Set uses a rooted full wrapper for lookup and
    retains the original Receiver through inherited descriptors and Proxy
    dispatch, including String own restrictions and strict/sloppy refusal.
    Its separate remediation node remains ready and unlanded."
  - "The Set-specific references below have focused Linux AMD64 evidence
    on source 43b84b70: complete Node.js and Deno ordinary/host-cc property
    files and a fresh normal sanitizer self-probe passed. Original stdout,
    exposed-stderr, positive-GC and foreign allocation/root/realm/retry
    assertions passed; raw successful-case outputs/counter values were not
    retained. PLAN-M5C.md records the exact scope and artifact provenance."
  - "The additional Set Array-ancestry fixed subject has focused Linux
    AMD64 evidence on combined source c4bcb412: all twelve Set registrations
    across Node.js/Deno and ordinary/host-cc passed, with the normal seven
    sanitizer self tests. Original assertions prove stdout, exposed stderr,
    collection and allocation/root/realm/retry behavior; successful raw
    counter values remain absent. The loops derive 344 JS subject/policy
    invocations plus four C registrations, separately from passing test
    counts. The shared focus used nine actual commands across two lock
    admissions after a preserved first-checkpoint supervisor failure.
    Historical 43b84b70 evidence retains its own inputs and cardinality.
    PLAN-M5C.md records provenance and the remaining integration gates."
  - "Earlier wrapper references remain wrapper evidence. Standards and
    guard-fallback assessments here retain that wrapper scope; no inherited
    Set test262 observation or new guard is claimed. The generic Set store
    adds no guard, retaining the compound-assignment record's omission and
    named replacement evidence. Matching macOS/cross-target, full ordinary,
    extended and standards gates, full UPDATE, independent reviews and exact
    candidate/Main CI remain required for the Set node."
