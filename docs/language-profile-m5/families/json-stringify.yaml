version: 1
id: json-stringify
title: "JSON stringify"
scope:
  - "The ordinary non-constructible JSON.stringify function and
    SerializeJSONProperty, including toJSON before a callable replacer,
    specified receivers and key arguments, primitive-wrapper conversion,
    finite and non-finite Number handling, BigInt rejection, UTF-16 string
    quoting, and omission or Array null substitution for values without a JSON
    representation."
  - "Replacer Arrays, including Proxy Arrays, array-like length and indexed
    Get, String and Number primitive or wrapper conversion, stable
    deduplication, inherited property selection, and property-list reuse at
    every object depth."
  - "Array length snapshots, object enumerable-own-string-key snapshots,
    OrdinaryOwnPropertyKeys ordering, observable Proxy operations, numeric and
    string gap handling, pretty-print indentation, abrupt completion,
    active-ancestor cycle detection, and deterministic bounded recursion."
  - "Reviewed standards coverage is the 72 edition paths under
    test/built-ins/JSON/*.js and test/built-ins/JSON/stringify/: 67 pass and
    five remain unsupported for cross-realm, Boolean-binding, or general
    BigInt primitive-wrapper prerequisites outside this node."
