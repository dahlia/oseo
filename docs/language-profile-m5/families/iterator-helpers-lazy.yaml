version: 1
id: iterator-helpers-lazy
title: "Lazy iterator helpers"
scope:
  - "Iterator.prototype map, filter, take, drop, and flatMap, including
    receiver and argument validation with the underlying-iterator close it
    performs, the single captured next method, callback counters, take and
    drop limit conversion and range checks, flatMap flattening with
    rejected primitives, the %IteratorHelperPrototype% next and return
    methods, generator-state re-entrancy, and close forwarding before the
    first step, while suspended, and after completion."
  - "Reviewed standards coverage is all 184 upstream paths under
    test/built-ins/Iterator/prototype/drop/,
    test/built-ins/Iterator/prototype/filter/,
    test/built-ins/Iterator/prototype/flatMap/,
    test/built-ins/Iterator/prototype/map/, and
    test/built-ins/Iterator/prototype/take/. The IH-A focused precheck
    observes all 184 as pass after admitting iterator-helpers. Its raw
    inputs and observations are recorded in
    docs/m5c-graph/iterator-helpers-tag-activation.md. The accepted full
    UPDATE on U a678c85e records these method paths as pass.
    temporalHelpers.js remains unadmitted and belongs to IH-B;
    it is not required by these method paths."
  - "One observation is native-only rather than differential. Re-entering a
    suspended helper from the underlying iterator return method reaches the
    running-generator TypeError ECMA-262 specifies, and the two reference
    hosts disagree about it: Node.js reports a done result while Deno
    reports that TypeError. tests/native.ts asserts the specified behavior
    directly, because a differential fixture requires both reference hosts
    to agree."
owners:
