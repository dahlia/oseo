version: 1
id: math-namespace
title: "Math namespace object"
scope:
  - "The realm-owned Math namespace object, its ordinary [[Prototype]], its
    replaceable global-object property, and its Symbol.toStringTag."
  - "The eight value properties Math.E, Math.LN10, Math.LN2, Math.LOG10E,
    Math.LOG2E, Math.PI, Math.SQRT1_2, and Math.SQRT2."
  - "The thirty-six function properties of 21.3.2, their names, lengths,
    argument conversion order, and the exact results the edition specifies
    for signed zeroes, infinities, NaN, and the exactly determined
    operations."
