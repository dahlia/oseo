  - path: test/language/expressions/assignment/S11.13.1_A6_T1.js
    group: G3
    subject: "PutValue writes through the Reference resolved before the
      right-hand side, even when evaluating it adds a nearer declarative
      binding."
    disposition: deferral
    assessment: ec-declarative-lref-deferral
    sourceDigest: "3237b19c38d727e37cb184fb0c760c8996622e4fd9e53c39ee8ae5305d0\
      3b4d6"
    observationDigest: "ecc5d0f47951110d25ee5a19dca34fa5c03ef5358346a0f24b1ddd\
      f4126738a9"
    remainingContract: 'In a sloppy inner function, x = (eval("var x;"), 1)
      writes 1 to the outer function''s x resolved before the right-hand side,
      although the eval adds var x to the inner function''s variable
      environment: the inner x then reads undefined and the outer x reads 1.'
    reason: "S11.13.1_A5_T1, S11.13.1_A5_T2 and S11.13.1_A5_T3 pass for the
      object environment record variant, where the right-hand side deletes the
      with object's binding. A declarative environment record gains a binding
      after its function is instantiated only through a direct eval var
      declaration; a static var is instantiated before the assignment runs, and
      a host Script declares globally, so no static or host Script witness
      reproduces this variant."
