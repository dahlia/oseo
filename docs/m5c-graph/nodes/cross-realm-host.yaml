version: 1
id: cross-realm-host
title: Observe cross-realm cases
delivers: "Implements realm creation beyond the initial realm and the
  $262.createRealm host capability that ADR 0013 keeps inside the claim, so
  the 84 reviewed paths whose unsupported frontmatter features include
  cross-realm are observed. One of them also needs iterator-helpers. Six
  carry the dynamic-source tag; a realm observation that then reaches the
  ADR 0016 boundary is reassigned in the landing change, not claimed. Also
  installs the global eval value and descriptor in every realm; calling the
  value reports the ADR 0016 boundary with the owned OSEO1001 diagnostic, as
  the sibling source constructors do, without admitting source evaluation.
  Add the exact eval runtime rejection message to the dynamic surface
  predicate in tools/m5c-exclusion-audit.ts in the same landing; preserve
  unrelated runtime failures and reviewed per-path boundary assessments.
  This enables observation-batch-01 to close exactly 2 additional paths,
  test/built-ins/Object/getOwnPropertyDescriptor/15.2.3.3-4-4.js and
  test/built-ins/Object/getOwnPropertyNames/15.2.3.4-4-1.js, which remain owned
  and observed by observation-batch-01 rather than admitted by this node."
dependencies:
  - unsupported-ownership-audit
landed: false
status: ready
