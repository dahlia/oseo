  test/language/arguments-object/10.5-1-s.js, a strict arguments
  assignment early error;
  test/language/block-scope/leave/outermost-binding-updated-in-catch-bl\
  ock-nested-block-let-declaration-unseen-outside-of-block.js, a block
  scope exit probe; test/language/comments/S7.4_A5.js and S7.4_A6.js,
  comment code unit probes; and
  test/language/comments/mongolian-vowel-separator-single-eval.js, a
