  test/language/expressions/concatenation/S9.8_A1_T2.js, whose third
  check reads the result of eval of var x; the whitespace probe
  test/language/expressions/conditional/S11.12_A1.js; and
  test/language/expressions/delete/11.4.1-4.a-7.js, which deletes a
  global var inside eval code, 30 from batch 13 that use eval or the
  Function constructor only as test scaffolding under
  test/language/expressions/: the whitespace probes
  division/S11.5.2_A1.js, does-not-equals/S11.9.2_A1.js,
  greater-than/S11.8.2_A1.js, greater-than-or-equal/S11.8.4_A1.js,
