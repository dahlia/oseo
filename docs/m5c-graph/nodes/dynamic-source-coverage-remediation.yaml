  well-known-intrinsics-harness
  assert AsyncFunction, AsyncGeneratorFunction, and GeneratorFunction
  are constructible before their trailing zero-argument construction
  reports the ADR 0016 run-time rejection, so their IsConstructor
  subject stays inside the claim. Obtain the maintainer accounting
  decision in PLAN-M5C.md, then review equivalent ahead-of-time
  observation or replacement evidence per original path; preserve all
  paths and assertions, never emulate runtime eval or widen ADR 0016,
  and keep unresolved rows under remediation. Batch 16 preparation adds
  exactly 17 disjoint mixed-core originals, source hashes and missing
  contracts listed in docs/m5c-graph/observation-batch-16.md. Preserve
  the previous 273 owners and all their contracts; these additions
  retain active remediation and authorize no completed replacement or
