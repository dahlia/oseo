version: 1
id: dynamic-source-callable-family
title: Cover ordinary callable dynamic source subjects
delivers: "DS-4 of the dynamic-source-coverage-remediation split approved by
  the maintainer decision of 2026-10-28, item 4. Owns exactly the 86
  existing umbrella paths listed in
  docs/m5c-graph/dynamic-source-callable-family.md: the ordinary callable,
  call/apply, instanceof, descriptor, seal, and array-like family (76),
  Function subclass construction (1), the 8 batch 15 object-literal accessor
  and descriptor paths, and the batch 16 typeof callability path, as grouped
  by the 2026-10-24 audit families and, for later additions, by their
  recorded missing contracts. The umbrella owns them until this node lands.
  For each path, reviews ahead-of-time observation or replacement evidence
  for every non-source subject. A path closes under
  adr:0016-dynamic-source-boundary only by the item 1 rule, with a
  fresh-digest exclusion-audit record naming that evidence and showing that
  only source evaluation remains; otherwise it stays in remediation.
  Preserves all paths and assertions; never counts a pass, emulates eval or
  source construction, or widens ADR 0016; ADR 0016 and ADR 0019 remain
  unchanged."
dependencies:
  - authorized-exclusion-audit
landed: false
status: ready
