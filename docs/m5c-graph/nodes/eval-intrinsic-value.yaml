version: 1
id: eval-intrinsic-value
title: Decide the eval function value
delivers: "Owns the 16 reviewed paths rejected with Unknown binding 'eval'
  that read %eval% only as a value and never call it: 8 Promise
  ctx-non-ctor, 6 Array callback or element, and 2 global property cases.
  Cross-realm-host installs the eval value and global descriptor in every
  realm. This node resolves the compiler's handling of the bare eval identifier
  read as a value, admitting those reads or obtaining an accepted record that
  bounds their exclusion. Its admission-or-exclusion decision covers identifier
  reads; the global value installation belongs to cross-realm-host. ADR 0016
  excludes eval in call position rather than the binding."
dependencies:
  - cross-realm-host
  - unsupported-ownership-audit
landed: false
status: ready
