version: 1
id: eval-intrinsic-value
title: Decide the eval function value
delivers: "Originally owned 33 reviewed unsupported paths rejected with
  Unknown binding 'eval'. These included 25 paths
  that read %eval% as a value: 8 Promise
  ctx-non-ctor, 6 Array callback or element, 2 global property cases, and
  test/built-ins/Proxy/create-target-is-not-a-constructor.js, and 8 eval
  intrinsic cases admitted by observation-batch-04, plus
  test/language/expressions/assignmenttargettype/\
  simple-basic-identifierreference-eval.js
  from observation-batch-09, which assigns the bare identifier without source
  evaluation, plus seven observation-batch-11 paths under
  test/language/expressions/class/:
  private-getter-brand-check-multiple-evaluations-of-class-eval-indirect.js,
  private-method-brand-check-multiple-evaluations-of-class-eval-indirect.js,
  private-setter-brand-check-multiple-evaluations-of-class-eval-indirect.js,
  private-static-field-multiple-evaluations-of-class-eval-indirect.js,
  private-static-getter-multiple-evaluations-of-class-eval-indirect.js,
  private-static-method-brand-check-\
  multiple-evaluations-of-class-eval-indirect.js, and
  private-static-setter-multiple-evaluations-of-class-eval-indirect.js.
  Each passes the bare eval identifier as an argument to a helper that calls
  it on a class source string. Before admission the identifier read was
  rejected as an unknown binding before that call or any private name
  or brand assertion ran. Their private name and brand subjects stay
  inside the claim; a new complete update must reassess their boundary.
  The eval cases observe
  length, name, prototype absence, and nonconstructibility without source
  evaluation. The Proxy case
  wraps eval and calls the proxy with no arguments, so it evaluates no source
  and observes callable/nonconstructible target behavior. The historical
  four-source update on edccfd292b245c80c3503a93bf1a268fc99506c7
  observed that path as a pass; it is not an observation of this source.
  Cross-realm-host installs the eval value and global descriptor in every
  realm. This node resolves the compiler's handling of the bare eval identifier
  read as a value, admitting those reads or obtaining an accepted record that
  bounds their exclusion. Its admission-or-exclusion decision covers identifier
  reads; the global value installation belongs to cross-realm-host. ADR 0016
  excludes eval in call position rather than the binding. This node also
  covers the eval identifier read through a with object environment that
  falls back to the global binding in
  test/language/eval-code/direct/global-env-rec-with.js. Before this node
  that read failed at run time with OSEO2001 ReferenceError: Binding is read
  before initialization. It now resolves to the global %eval% value, so a
  String call reaches the existing OSEO1001 eval compiles source text at run
  time boundary. The parser statements test and the native
  dynamic-source-eval-with-fallback fixture are its evidence; the upstream
  direct and indirect global-env-rec-with.js paths remain unreviewed under
  observation-batch-06, and this node adds no observation for them. This
  repairs identifier lookup without admitting direct eval source evaluation.
  The historical four-source update on
  edccfd292b245c80c3503a93bf1a268fc99506c7 observed 26 passes among
  the original 33 paths and seven private-class cases at the existing
  source-compilation boundary. Clean source preparation restored successful
  Main's canonical observations and owners. The fresh complete update on
  6e54c5d5 observes 26 passes and seven private-class cases at the existing
  run-time source-compilation boundary. Those seven now belong to
  dynamic-source-coverage-remediation under the existing fixture-construction
  assessment: their private name and brand subjects stay inside the claim,
  pending replacement evidence or a maintainer accounting decision. No
  exclusion is added, and this node remains unlanded.
  The node also repairs every identifier read through a selected with
  Object Environment Record, for any name, not only eval. A value read, a
  typeof operand, and a call callee perform GetBindingValue (ECMA-262 2025
  9.1.1.2.6): the selected object's own HasProperty runs again before Get.
  A binding gone since HasBinding reads undefined in non-strict code and
  throws the missing binding's ReferenceError in strict code, for a call
  before its arguments are evaluated. An abrupt has trap propagates before
  Get. An ordinary call keeps the selected object as its receiver, the
  selected object, key, value, and receiver stay rooted across the added
  test, and the all-miss fallback, with delete, and compound and update
  reads are unchanged. The Identifier reads through with environments
  sections of PLAN-M5.md and the M5 profile specify it; the evidence is
  tests/native/fixtures/with-get-binding-value.ts under both
  specialization policies with forced collection, slot 0x60003d02 of
  tests/property/m5-global-object-record.property.test.ts, and parser
  structural tests. This repair admits no test262 path and changes none of
  the counts, owners, or decisions above. The four pinned GetBindingValue
  subjects under test/language/statements/with/,
  get-binding-value-call-with-proxy-env.js,
  get-binding-value-idref-with-proxy-env.js,
  get-mutable-binding-binding-deleted-in-get-unscopables.js, and its
  -strict-mode.js twin, remain unreviewed under observation-batch-28. It
  admits no eval source evaluation; the ADR 0016 boundary is unchanged."
dependencies:
