version: 1
id: regexp-property-escape-match-cost
title: Reduce RegExp property escape matching and table cost
delivers: "Profiles the native matcher for Unicode property escape classes
  and the size of their emitted tables, then fixes the dominant cost
  without changing matching semantics. Baseline from the phase report:
  built-ins/RegExp spends about 5,518 s in native execution, several times
  any other family, mostly in property escape tests; for example
  test/built-ins/RegExp/property-escapes/generated/ID_Start.js takes
  11.6 s of execution and 31.5 s of compile and link over 4 variants with
  14 MB of C in total, about 3.5 MB per variant. Records before and after
  per-variant native time, C bytes and compile time. Owns no test262
  path; decision
  ~/.local/state/oseo-m5c/decisions/done/product-performance-nodes-20261028.md\
  ; work note docs/m5c-graph/regexp-property-escape-match-cost.md."
dependencies:
  - regexp-property-escape-harness
  - unsupported-ownership-audit
landed: false
status: ready
