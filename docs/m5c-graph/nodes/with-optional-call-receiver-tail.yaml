  ordinary strict tail call control, under both specialization policies,
  with forced collection evidence that the proper-tail-calls trampoline
  keeps the receiver, callee, and arguments rooted and live, and MIR
  structural evidence that the call stays a tail call returned directly.
  Owns no manifest path; this is a generic optional-call correction, not an
  eval source evaluation admission or an exclusion."
