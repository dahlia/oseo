version: 1
checkpoint: M5c
usage: "Take a node whose status is ready and whose landed field is false.
  The measured tail is already partitioned into bounded observation batches
  and remediation owners. The remediation-work-graph audit records exact
  coverage and missing collisions in docs/m5c-graph/remediation-audit.md.
  Add genuinely new work only from observations and put every new terminal
  prerequisite on the m5-exit-audit path. Update baseline whenever the
  checked-in reviewed manifest changes; check:m5c-graph rejects stale counts."
baseline:
  expectedNegatives: 2581
  harnessFailures: 0
  infrastructureFailures: 0
  inventoryPaths: 41091
  passes: 24234
  reviewedPaths: 28311
  semanticFailures: 0
  suiteRevision: f2d1435644797268dca1f7988cad5a4e89ccd8d2
  unreviewedPaths: 12780
  unsupportedProfileFeatures: 1496
summary:
  nodes: 85
  ready: 79
  blocked: 6
  parked: 0
  landed: 44
serializationPoints:
  - path: docs/m5c-graph/graph.yaml
    note: "Every landing updates node state and the evidence baseline. Merge
      graph changes one at a time."
  - path: docs/m5c-closure/ledger.yaml
    note: "The closure ledger will assign one state and one owner to every
      applicable inventory path. Ownership audits and batch planning may both
      need to extend it."
  - path: docs/m5c-closure/exclusion-audit.yaml
    note: "Boundary assessments bind accepted records, upstream sources, and
      normalized rejection observations. A changed diagnostic or source needs
      a reviewed assessment update alongside its manifest and ledger owners."
  - path: tests/test262/subset.yaml
    note: "Every newly reviewed path enters the reviewed subset before its
      observation can appear in the result manifest."
  - path: tests/test262/results.yaml
    note: "The manifest index and partitions are regenerated as one canonical
      observation set, so two lanes never regenerate them concurrently."
  - path: docs/language-profile-m5.md
    note: "Semantic remediation updates the normative profile and its family
      evidence records in the same change."
  - path: docs/m5c-closure/observation-batches.yaml
    note: "Batch landings refresh fixed selectors and measured counts; serialize
      the derived update with ledger and manifest publication."
  - path: tests/test262/target-parity.yaml
    note: "Every manifest update publishes its index, partitions, and parity
      digest together; never merge a digest from another observation set."
collisions:
  - path: docs/m5c-closure/exclusion-audit.yaml
    nodes:
      - dynamic-source-coverage-remediation
      - typed-array-proto-coverage-remediation
    note: "Mixed-coverage accounting updates independent assessments in the
      exclusion audit; serialize these edits. The TypedArray owner follows
      its classification prerequisite, which stays outside this group."
  - path: docs/m5c-closure/exclusion-audit.yaml
    nodes:
      - authorized-exclusion-audit
      - cross-realm-host
      - runtime-dynamic-source-classification
    note: "The initial audit, realm-owned eval, and runtime rejection
      classification may revise independent boundary assessments; serialize
      their audit edits."
  - path: docs/m5c-closure/exclusion-audit.yaml
    nodes:
      - annexb-proto-dependency-classification
      - cross-realm-host
      - dynamic-source-coverage-remediation
      - runtime-dynamic-source-classification
    note: "Realm-owned eval, dynamic source accounting, and runtime rejection
      classification may revise reviewed boundary assessments; serialize their
      audit edits."
  - path: docs/m5c-closure/ledger.yaml
    nodes:
      - observation-batch-plan
      - unsupported-ownership-audit
    note: "These ownership nodes classify paths after the ledger lands. Run
      their analysis concurrently if useful, but serialize their ledger edits."
  - path: docs/m5c-closure/ledger.yaml
