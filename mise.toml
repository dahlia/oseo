min_version = "2026.6.1"

[settings]
experimental = true

[hooks]
postinstall = "mise run install-hooks"

[tools]
"aqua:dahlia/hongdown" = "0.5.3"
"aqua:nushell/nushell" = "0.116.0"
# The mise registry has no jactionlint entry yet, so name the backend.
"ubi:jdx/jactionlint" = "2.1.0"
pnpm = "12.18.0"
bun = "1.4.4"
"npm:postject" = "1.0.0-alpha.6"
deno = "2.9.7"
node = "24.21.0"
oxfmt = "0.70.0"
shellcheck = "0.11.0"
zig = "0.16.0"

[deps.pnpm]
auto = true
sources = [
  "package.json",
  "packages/*/package.json",
  "pnpm-lock.yaml",
  "pnpm-workspace.yaml",
]
run = "pnpm install --frozen-lockfile"

[tasks.build]
description = "Build every npm package as validated ESM"
run = "pnpm exec tsdown --workspace"

[tasks."perf:profile:discover"]
description = "Record read-only profiler tool discovery (not acceptance)"
usage = 'arg "<directory>" help="New evidence directory; parent must exist"'
run = 'node tools/perf-profile.ts discover "${usage_directory?}"'

[tasks."perf:profile:capture"]
description = "Capture an unchanged native artifact from an explicit contract"
usage = '''
arg "<request>" help="JSON launch contract with frozen hashes and byte oracle"
arg "<directory>" help="New evidence directory; parent must exist"
'''
run = '''
node tools/perf-profile.ts capture "${usage_request?}" "${usage_directory?}"
'''

[tasks."perf:profile:smoke"]
description = "Build and capture a synthetic optimized native method probe"
depends = ["build"]
usage = 'arg "<directory>" help="New probe directory; not performance evidence"'
run = 'node tools/perf-profile-smoke.ts "${usage_directory?}"'

[tasks.bump-versions]
description = "Atomically set the lockstep package version"
usage = 'arg "<version>" help="Strict SemVer for every @oseo package"'
run = '''
node tools/versions.ts set "${usage_version?}"
mise run check:versions
'''

[tasks.check]
depends = [
  "check:actions",
  "check:anti-slop",
  "check:boundaries",
  "check:commands",
  "check:compatibility-ratchet",
  "check:evidence-lanes",
  "check:fmt",
  "check:language-claim-audit",
  "check:test262-inventory",
  "check:lines",
  "check:lint",
  "check:macos-lanes",
  "check:m5b-graph",
  "check:m5b-node-scope",
  "check:m5c-closure-ledger",
  "check:m5c-deferrals",
  "check:m5c-exclusion-audit",
  "check:m5c-graph",
  "check:m5c-observation-batches",
  "check:native-host-guards",
  "check:native-toolchains",
  "check:packages",
  "check:perf",
  "check:selfhosted-mac-shell",
  "check:types",
  "check:unicode-tables",
  "check:versions",
]

[tasks."check:actions"]
description = "Validate GitHub Actions workflows"
# .github/jactionlint.yaml selects the profile and the two rules this
# repository turns off, each with its reason.
run = "jactionlint"

[tasks."check:anti-slop"]
description = "Exercise every enabled generic anti-slop rule"
run = "node --test tests/anti-slop.test.ts"

[tasks."check:boundaries"]
run = "node tools/check-boundaries.ts"

[tasks."check:commit-message"]
description = "Reject a malformed commit message given its file"
raw_args = true
run = "node tools/check-commit-message.ts"

[tasks."check:commit-messages"]
description = "Reject forbidden assistant trailers in a revision range"
raw_args = true
run = "node tools/check-commit-messages.ts"

[tasks."check:compatibility-ratchet"]
description = "Reject measured compatibility reversals"
run = "node tools/compatibility-ratchet.ts"

[tasks."check:evidence-lanes"]
description = "Validate normative per-family evidence records"
run = "node tools/evidence-lanes.ts"

[tasks."check:property-case-durations"]
description = "Require complete case shards within the original deadline"
raw_args = true
run = "node tools/check-property-case-durations.ts"

[tasks."check:fmt"]
depends = ["check:fmt:md", "check:fmt:mise", "check:fmt:oxfmt"]

[tasks."check:fmt:md"]
run = "hongdown --check"

[tasks."check:fmt:mise"]
run = "mise fmt --check"

[tasks."check:fmt:oxfmt"]
run = "oxfmt --check ."

[tasks."check:language-claim-audit"]
description = "Prove the ADR 0032 claim accounting over the expanded inventory"
run = "node tools/language-claim-audit.ts"

[tasks."check:lines"]
run = "node tools/check-lines.ts"

[tasks."check:lint"]
run = "pnpm exec oxlint ."

[tasks."check:m5b-graph"]
description = "Validate the checked-in M5b work graph"
run = "node tools/m5b-graph.ts"

[tasks."check:m5b-node-scope"]
description = "Keep reviewed evidence within the named M5b node scope"
run = "node tools/m5b-node-scope.ts"

[tasks."check:m5c-closure-ledger"]
description = "Validate the derived M5c inventory closure ledger"
run = "node tools/m5c-closure-ledger.ts"

[tasks."check:m5c-deferrals"]
description = "Validate the ADR 0031 named deferral list"
run = "node tools/m5c-deferrals.ts"

[tasks."check:m5c-exclusion-audit"]
description = "Validate bounded M5c exclusions and unresolved coverage"
run = "node tools/m5c-exclusion-audit.ts"

[tasks."check:m5c-graph"]
description = "Validate the checked-in M5c closure graph"
run = "node tools/m5c-graph.ts"

[tasks."check:m5c-observation-batches"]
description = "Validate the M5c observation batch plan and its owners"
run = "node tools/m5c-observation-batches.ts"

[tasks."check:native-host-guards"]
description = "Require unsupported-host skips throughout tests/"
run = '''
node --test tests/native-host-guards.test.ts
node tools/check-native-host-guards.ts
'''

[tasks."check:packages"]
depends = ["build"]
run = '''
node tools/check-packages.ts
deno publish --dry-run --allow-dirty
'''

[tasks."check:test262-inventory"]
description = "Validate the pinned ECMA-262 applicable-test inventory"
run = "node tools/test262-inventory.ts"

[tasks."check:types"]
depends = ["build"]
run = '''
pnpm exec tsc --version
pnpm exec tsc --project tsconfig.json
pnpm exec tsc --project tools/oxlint/tsconfig.json
'''

[tasks."check:unicode-tables"]
description = "Reject Unicode tables the pinned inputs do not produce"
run = "node tools/unicode-tables.ts"

[tasks."check:versions"]
run = '''
node tools/versions.ts check
deno run --allow-read tools/versions.ts check
'''

[tasks.clean]
description = "Remove generated package and native-test artifacts"
run = "rm -rf packages/*/dist artifacts"

[tasks.fmt]
depends = ["fmt:md", "fmt:mise", "fmt:oxfmt"]

[tasks."fmt:md"]
run = "hongdown --write"

[tasks."fmt:mise"]
run = "mise fmt"

[tasks."fmt:oxfmt"]
run = "oxfmt ."

[tasks.install-hooks]
description = "Install the local pre-commit and commit-msg hooks"
run_windows = "echo Git hook installation is skipped on Windows."
run = """
# git rev-parse --git-path resolves core.hooksPath and a linked worktree's
# shared hook directory. Neither hook may go to $GIT_DIR/hooks, which git
# never reads in either case, so --write is not used for the generated one
# either: it hard-codes that path.
hooks=$(git rev-parse --git-path hooks)
mkdir -p "$hooks"

mise generate git-pre-commit --task=check > "$hooks/pre-commit"
chmod +x "$hooks/pre-commit"

# The commit-msg hook is written by hand for the guard below, not because
# mise cannot generate it. mise 2026.9.1 forwards "$@" from a generated
# hook, which it did not when this task was written, so the argument git
# passes as $1 would now reach the task either way.
#
# A hook outlives the checkout it was installed from. It stays in .git while
# the working tree moves to a branch cut before this task existed, or to an
# older revision during a bisect, and there the task it calls is not defined
# and every commit would fail for a reason that has nothing to do with its
# message. The guard makes the hook check for the checker it needs and step
# aside when the tree cannot answer for it.
printf '%s\\n' \\
  '#!/bin/sh' \\
  '# Installed by mise run install-hooks.' \\
  '[ -f tools/check-commit-message.ts ] || exit 0' \\
  'exec mise run check:commit-message "$1"' \\
  > "$hooks/commit-msg"
chmod +x "$hooks/commit-msg"
"""

[tasks."probe:native-io:clock"]
description = "Measure the native clock and wakeup adapter facilities"
raw_args = true
run = "node tools/native-io-probe.ts"

[tasks."probe:regexp"]
description = "Measure the regular expression matcher backend candidates"
depends = ["build"]
raw_args = true
run = "node tools/regexp-probes.ts"

[tasks.test]
depends = [
  "test:deno",
  "test:native",
  "test:native:optimized",
  "test:node",
  "test:test262",
]

[tasks."test:deno"]
description = "Run package source and demonstration tests under Deno"
depends = ["build"]
run = "deno test -A packages tests/preview-demos.test.ts"

[tasks."test:native"]
description = "Run host-native fixtures and cross-target structural checks"
depends = ["build"]
raw_args = true
run = "node tests/native.ts"

[tasks."test:native:optimized"]
description = "Run optimized native fixtures and cross-target checks"
depends = ["build"]
raw_args = true
run = "node tests/native.ts"
env.OSEO_NATIVE_BUILD_CONFIG = "optimized"

[tasks."test:test262:optimized"]
description = "Run the reviewed test262 corpus in the optimized configuration"
depends = ["build"]
raw_args = true
run = "node tools/test262.ts"
env.OSEO_NATIVE_BUILD_CONFIG = "optimized"

[tasks."test:property:native:optimized"]
description = "Run native semantic properties in the optimized configuration"
depends = ["build"]
raw_args = true
run = "node tools/run-native-tests.ts tests/property/*.property.test.ts"
env.OSEO_NATIVE_BUILD_CONFIG = "optimized"

[tasks."test:property:native:optimized:shard"]
description = "Run selected optimized host-native property test files"
depends = ["build"]
raw_args = true
run = "node tools/run-native-tests.ts"
env.OSEO_NATIVE_BUILD_CONFIG = "optimized"

[tasks."test:node"]
description = "Run source, version, and built ESM tests under Node.js"
depends = ["build"]
raw_args = true
run = "node --test"

[tasks."test:node:shard"]
description = "Run one ordinary Node shard selected by measured file weights"
depends = ["build"]
raw_args = true
run = "node tools/run-node-shard.ts"

[tasks."test:property:extended"]
description = "Run property suites at ten times the ordinary case budget"
depends = ["test:property:extended:package"]
run = "mise run --skip-deps test:property:extended:native"

[tasks."test:property:extended:native"]
description = "Run extended host-native semantic properties"
depends = ["build"]
run = "node tools/run-native-tests.ts tests/property/*.property.test.ts"

[tasks."test:property:extended:native".env]
OSEO_PROPERTY_RUN_SCALE = "10"
OSEO_PROPERTY_SEED = "1592590339"
OSEO_PROPERTY_SIZE = "large"

[tasks."test:property:extended:native:shard"]
description = "Run selected extended host-native property test files"
depends = ["build"]
raw_args = true
run = "node tools/run-native-tests.ts"

[tasks."test:property:extended:native:shard".env]
OSEO_PROPERTY_RUN_SCALE = "10"
OSEO_PROPERTY_SEED = "1592590339"
OSEO_PROPERTY_SIZE = "large"

[tasks."test:property:extended:package"]
description = "Run extended package properties under Node.js and Deno"
depends = ["build"]
shell = "nu -c"
run = '''
let package_tests = (
  glob "packages/*/tests/**/*.property.test.ts"
  | each { |path| $path | into string }
)
for seed in [1592590337 1592590338] {
  with-env {
    OSEO_PROPERTY_RUN_SCALE: "10"
    OSEO_PROPERTY_SIZE: "large"
    OSEO_PROPERTY_SEED: ($seed | into string)
  } {
    ^node tools/run-native-tests.ts ...$package_tests
    ^deno test -A ...$package_tests
  }
}
'''

[tasks."test:property:native"]
description = "Run bounded host-native semantic properties"
depends = ["build"]
run = "node tools/run-native-tests.ts tests/property/*.property.test.ts"

[tasks."test:test262"]
description = "Run the pinned test262 subset on the matching native target"
depends = ["build"]
raw_args = true
run = "node tools/test262.ts"

[tasks."test262:update"]
description = "Regenerate the pinned reviewed test262 result manifest"
depends = ["build"]
run = "node tools/test262.ts --update"

[tasks."test262:update:changed"]
description = "Observe only reviewed subset entries changed since a baseline"
depends = ["build"]
raw_args = true
run = "node tools/test262.ts --update --changed"

[tasks."test262:reindex"]
description = "Rebuild the test262 index and parity from the partition files"
depends = ["build"]
run = "node tools/test262.ts --reindex"

[tasks."test262:inventory:update"]
description = "Regenerate the pinned ECMA-262 applicable-test inventory"
run = "node tools/test262-inventory.ts --update"

[tasks."report:language-coverage"]
description = "Print the post-M5 language coverage report"
run = "node tools/language-claim-audit.ts --print"

[tasks."report:m5-performance"]
description = "Measure M5 native fixture performance and print the report"
run = "node tools/m5-performance-report.ts --print"

[tasks."report:m5-performance:update"]
description = "Measure M5 native fixture performance and update its report"
run = """
node tools/m5-performance-report.ts --update
oxfmt docs/evidence/m5-performance/measurements.json
"""

[tasks."m5c:closure-ledger:update"]
description = "Regenerate the M5c closure ledger from the reviewed manifest"
run = "node tools/m5c-closure-ledger.ts --update"

[tasks."m5c:observation-batches:update"]
description = "Refresh M5c observation batch counts for fixed selectors"
run = "node tools/m5c-observation-batches.ts --update"

[tasks."m5c:observation-batches:plan"]
description = "Repartition unreviewed M5c paths into observation batches"
run = "node tools/m5c-observation-batches.ts --plan"

[tasks."unicode:update"]
description = "Regenerate the pinned Unicode tables from the reviewed inputs"
run = "node tools/unicode-tables.ts --update"

[tasks."test:sanitizer:self"]
description = "Verify host C sanitizer instrumentation in both code locations"
depends = ["build"]
run = "node --test tests/host-cc-*.test.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"

[tasks."test:sanitizer:runtime"]
description = "Run C runtime fixtures under host ASan and UBSan"
depends = ["build"]
run = "node --test --test-concurrency=1 tests/runtime-*.test.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"

[tasks."test:sanitizer:native"]
description = "Run native fixtures under host ASan and UBSan"
depends = ["build"]
raw_args = true
run = "node tests/native.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"

[tasks."test:sanitizer:property"]
description = "Run ordinary native properties under host ASan and UBSan"
depends = ["build"]
run = "node --test --test-concurrency=4 tests/property/*.property.test.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"
env.OSEO_PROPERTY_TIME_SCALE = """
{{ get_env(name='OSEO_PROPERTY_TIME_SCALE', default='3') }}"""

[tasks."test:sanitizer:property:shard"]
description = "Run selected ordinary native property test files with sanitizers"
depends = ["build"]
raw_args = true
run = "node --test --test-concurrency=4"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"
env.OSEO_PROPERTY_TIME_SCALE = """
{{ get_env(name='OSEO_PROPERTY_TIME_SCALE', default='3') }}"""

[tasks."test:sanitizer:property:shared"]
description = "Run sanitizer property files without dedicated files"
depends = ["build"]
raw_args = true
run = "node tools/run-sanitizer-property-shard.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"
env.OSEO_PROPERTY_TIME_SCALE = """
{{ get_env(name='OSEO_PROPERTY_TIME_SCALE', default='3') }}"""

[tasks."test:sanitizer:test262"]
description = "Measure a bounded test262 shard under host ASan and UBSan"
depends = ["build"]
raw_args = true
run = "node tools/test262.ts"
env.OSEO_NATIVE_TOOLCHAIN = "host-cc"

[tasks."check:native-toolchains"]
description = "Reject native tests that bypass sanitizer toolchain selection"
run = '''
node --test tests/native-toolchains.test.ts
node tools/check-native-toolchains.ts
'''

[tasks."ci:runtime-archive-cache"]
description = "Print the exact native runtime archive cache key and path"
run = "node tests/ci-runtime-archive-cache.ts"

[tasks."generate:macos-lanes"]
description = "Generate five measured macOS CI capacity lanes"
run = "node tools/generate-macos-lanes.ts"

[tasks."check:macos-lanes"]
description = "Check generated macOS CI lanes and preserved jobs"
run = """
node tools/generate-macos-lanes.ts --check
node --test tests/macos-lanes.test.ts tests/node-shard.test.ts \
  tests/sanitizer-property-shard.test.ts
"""

[tasks."check:selfhosted-mac-shell"]
description = "Lint dedicated Mac setup scripts"
run = "shellcheck tools/selfhosted-mac/*.sh"

[tasks."perf:prepare"]
description = "Prepare the comparison matrix without building or measuring"
run = "node tools/perf/prepare.ts"

[tasks."check:perf"]
depends = ["build"]
description = "Validate benchmark self-checks and evidence contracts"
run = "node --test tests/perf-harness.test.ts tests/perf-driver.test.ts"

[tasks."perf:build"]
description = "Build and freeze the nine-form optimized measurement matrix"
depends = ["build"]
run = "node tools/perf/build.ts"

[tasks."perf:measure"]
description = "Measure frozen artifacts in a Root-assigned exclusive slot"
run = "node tools/perf/measure.ts"

[tasks."perf:correctness"]
description = "Check all frozen roles without collecting measurement samples"
run = "node tools/perf/correctness.ts"

[tasks."generate:commands"]
description = "Generate the static CLI command registry"
run = "node packages/cli/tools/generate-commands.ts"

[tasks."check:commands"]
description = "Check the static CLI command registry"
run = "node packages/cli/tools/generate-commands.ts --check"
