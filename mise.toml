min_version = "2026.6.1"

[settings]
experimental = true

[hooks]
postinstall = "mise generate git-pre-commit --write --task=check"

[tools]
"aqua:dahlia/hongdown" = "0.5.1"
"aqua:nushell/nushell" = "0.114.1"
aube = "1.26.0"
deno = "2.9.2"
node = "24.18.0"
oxfmt = "0.59.0"
oxlint = "1.74.0"
zig = "0.16.0"

[deps.aube]
auto = true
run = "aube install --frozen-lockfile"

[tasks.build]
description = "Build every npm package as validated ESM"
run = "aube exec -- tsdown --workspace"

[tasks.bump-versions]
description = "Atomically set the lockstep package version"
usage = 'arg "<version>" help="Strict SemVer for every @oseo package"'
run = '''
node tools/versions.ts set "${usage_version?}"
mise run check:versions
'''

[tasks.check]
depends = [
  "check:boundaries",
  "check:fmt",
  "check:lines",
  "check:lint",
  "check:packages",
  "check:types",
  "check:versions",
]

[tasks."check:boundaries"]
run = "node tools/check-boundaries.ts"

[tasks."check:fmt"]
depends = ["check:fmt:md", "check:fmt:mise", "check:fmt:oxfmt"]

[tasks."check:fmt:md"]
run = "hongdown --check"

[tasks."check:fmt:mise"]
run = "mise fmt --check"

[tasks."check:fmt:oxfmt"]
run = "oxfmt --check ."

[tasks."check:lines"]
run = "node tools/check-lines.ts"

[tasks."check:lint"]
run = "oxlint --deny-warnings ."

[tasks."check:packages"]
depends = ["build"]
run = '''
node tools/check-packages.ts
deno publish --dry-run --allow-dirty
'''

[tasks."check:types"]
depends = ["build"]
run = '''
aube exec -- tsc --version
aube exec -- tsc --project tsconfig.json
'''

[tasks."check:versions"]
run = '''
node tools/versions.ts check
deno run --allow-read tools/versions.ts check
'''

[tasks.clean]
description = "Remove generated package and native-test artifacts"
run = "rm -rf packages/*/dist artifacts"

[tasks.fmt]
depends = ["fmt:md", "fmt:mise", "fmt:oxfmt"]

[tasks."fmt:md"]
run = "hongdown --write"

[tasks."fmt:mise"]
run = "mise fmt"

[tasks."fmt:oxfmt"]
run = "oxfmt ."

[tasks."probe:abi-roots"]
run = "bash experiments/abi-roots/run.sh"

[tasks."probe:host-parser"]
run = "node experiments/parser/check.ts"

[tasks."probe:native-boundary"]
run = "bash experiments/native/run.sh"

[tasks."probe:value-layouts"]
run = "bash experiments/value/run.sh"

[tasks.test]
depends = [
  "test:deno",
  "test:native",
  "test:node",
  "test:probes",
  "test:test262",
]

[tasks."test:deno"]
description = "Run package source tests under Deno"
run = "deno test -A packages"

[tasks."test:native"]
description = "Build, run, compare, and cross-link the native fixture"
depends = ["build"]
run = "node tests/native.ts"

[tasks."test:node"]
description = "Run source, version, and built ESM tests under Node.js"
depends = ["build"]
run = "node --test"

[tasks."test:probes"]
description = "Run the architecture decision probes as regression tests"
run = '''
mise run probe:abi-roots
mise run probe:host-parser
mise run probe:native-boundary
mise run probe:value-layouts
'''

[tasks."test:property:extended"]
description = "Run property suites at ten times the ordinary case budget"
depends = ["build"]
shell = "nu -c"
run = '''
let package_tests = (
  glob "packages/testkit/tests/*.property.test.ts"
  | each { |path| $path | into string }
)
for seed in [1592590337 1592590338] {
  with-env {
    OSEO_PROPERTY_RUN_SCALE: "10"
    OSEO_PROPERTY_SIZE: "large"
    OSEO_PROPERTY_SEED: ($seed | into string)
  } {
    ^node --test ...$package_tests
    ^deno test -A ...$package_tests
  }
}
let native_tests = (
  glob "tests/property/*.property.test.ts"
  | each { |path| $path | into string }
)
with-env {
  OSEO_PROPERTY_RUN_SCALE: "10"
  OSEO_PROPERTY_SIZE: "large"
  OSEO_PROPERTY_SEED: "1592590339"
} {
  ^node --test ...$native_tests
}
'''

[tasks."test:property:native"]
description = "Run bounded source-to-native M4 schedule properties"
depends = ["build"]
run = "node --test tests/property/*.property.test.ts"

[tasks."test:test262"]
description = "Run the pinned reviewed test262 subset"
depends = ["build"]
run = "node tools/test262.ts"

[tasks."test262:update"]
description = "Regenerate the pinned reviewed test262 result manifest"
depends = ["build"]
run = "node tools/test262.ts --update"
