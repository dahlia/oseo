min_version = "2026.6.1"

[settings]
experimental = true

[tools]
"aqua:dahlia/hongdown" = "0.5.1"
aube = "1.26.0"
deno = "2.9.2"
node = "24.18.0"
"npm:typescript" = "7.0.2"
oxfmt = "0.59.0"
oxlint = "1.74.0"
zig = "0.16.0"

[deps.aube]
auto = true
run = "aube install --frozen-lockfile"

[tasks.check]
depends = ["check:*"]

[tasks."check:probes"]
depends = [
  "probe:abi-roots",
  "probe:host-parser",
  "probe:native-boundary",
  "probe:value-layouts",
]

[tasks."check:fmt:md"]
run = "hongdown --check"

[tasks."check:fmt:mise"]
run = "mise fmt --check"

[tasks."check:fmt:oxfmt"]
run = "oxfmt --check ."

[tasks."check:lint"]
run = "oxlint --deny-warnings ."

[tasks."check:types"]
run = """
tsc --version
tsc --project tsconfig.json
"""

[tasks.fmt]
depends = ["fmt:*"]

[tasks."fmt:md"]
run = "hongdown --write"

[tasks."fmt:mise"]
run = "mise fmt"

[tasks."fmt:oxfmt"]
run = "oxfmt ."

[tasks."probe:host-parser"]
run = "node experiments/parser/check.ts"

[tasks."probe:native-boundary"]
run = "bash experiments/native/run.sh"

[tasks."probe:value-layouts"]
run = "bash experiments/value/run.sh"

[tasks."probe:abi-roots"]
run = "bash experiments/abi-roots/run.sh"
