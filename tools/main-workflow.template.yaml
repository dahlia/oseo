name: main

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Commit to use as the compatibility baseline"
        required: true
        type: string

concurrency:
  # A main push gets its own group keyed by commit, because the ratchet reads
  # the previous push as its baseline. Sharing a group would let GitHub drop a
  # queued main run, and the next run would then measure against a commit no
  # run ever checked.
  group: >-
    main-${{ github.workflow }}-${{ github.ref }}-${{
      github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch compatibility baseline
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
          github.ref_type == 'branch' &&
          github.event.before != '0000000000000000000000000000000000000000')
        env:
          BASELINE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
        run: git fetch --no-tags origin "$BASELINE"
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - name: Check introduced commit messages
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Fetch both endpoints without making the history shallow. A
          # force-push's previous tip may no longer be on any remote ref.
          git fetch --no-tags origin "$COMMIT_HEAD"
          if [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags origin "$BASE"
          fi
          mise run check:commit-messages "$BASE..$COMMIT_HEAD"
      - run: mise run check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Explicit combinations: the hosted macOS Node.js suite runs in
        # test_node_shard and the Linux one in test_node_shard_linux, so
        # only Deno joins from either of those hosts here.
        include:
          - os: ubuntu-latest
            runtime: deno
          - os: macos-latest
            runtime: deno
          - os: windows-latest
            runtime: node
          - os: windows-latest
            runtime: deno
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - if: matrix.os == 'macos-latest'
        name: Discover profiling tools (read-only)
        run: >-
          node tools/perf-profile.ts discover
          "${{ runner.temp }}/oseo-profiler-discovery"
      - name: Retain profiling tool discovery
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: profiler-tool-discovery-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oseo-profiler-discovery
          if-no-files-found: error
      - uses: ./.github/actions/runtime-archive-cache
        if: runner.os != 'Windows'
      - run: mise run test:${{ matrix.runtime }}
      - name: Build performance correctness artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oseo-perf-correctness"
          mkdir "$root"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            node -p 'JSON.stringify({platform:process.platform,
              arch:process.arch,node:process.version,
              runId:process.env.GITHUB_RUN_ID,
              attempt:process.env.GITHUB_RUN_ATTEMPT,
              job:process.env.GITHUB_JOB,runner:process.env.RUNNER_NAME})'
            shasum -a 256 mise.toml pnpm-lock.yaml
            deno --version
            bun --version
            zig version
            mise ls --current --json npm:postject
          } > "$root/source-host.txt" 2>&1
          node -e 'if (process.platform !== "darwin" ||
            process.arch !== "arm64") process.exit(1)'
          OSEO_PERF_DIRECTORY="$root/build" \
            mise run perf:build 2>&1 | tee "$root/build.log"
      - name: Check performance artifact correctness
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oseo-perf-correctness"
          OSEO_PERF_DIRECTORY="$root/build" \
          OSEO_PERF_RESULTS="$root/correctness" \
            mise run perf:correctness 2>&1 | tee "$root/correctness.log"
      - name: Archive performance correctness artifacts
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/oseo-perf-correctness"
          test -s "$root/source-host.txt"
          # Keep absolute path mappings and executable modes, including
          # resolved engine files outside the fresh build directory.
          node --input-type=module - "$root" <<'JS'
          import { appendFileSync, existsSync, lstatSync,
            readFileSync, writeFileSync } from 'node:fs';
          const root = process.argv[2];
          const manifest = root + '/build/built.json';
          const paths = new Set([root]);
          const problem = (error) => {
            appendFileSync(root + '/archive-diagnostics.jsonl',
              JSON.stringify({ error: String(error) }) + '\n');
            writeFileSync(root + '/archive-incomplete', 'incomplete\n');
          };
          if (existsSync(manifest)) {
            try {
              const forms = JSON.parse(readFileSync(manifest)).forms;
              if (!Array.isArray(forms)) throw Error('Missing form list');
              for (const form of forms) {
                if (!form.run.command.startsWith(root + '/')) {
                  paths.add(form.run.command);
                }
                for (const file of form.identities) {
                  if (!file.path.startsWith(root + '/')) paths.add(file.path);
                }
              }
            } catch (error) { problem(error); }
          } else { problem(Error('Build manifest unavailable')); }
          const available = [];
          for (const path of paths) {
            try { lstatSync(path); available.push(path); }
            catch (error) { problem(error); }
          }
          writeFileSync(root + '/archive-paths',
            available.join('\0') + '\0');
          JS
          archive_status=0
          tar --null -czpPf "$RUNNER_TEMP/oseo-perf-correctness.tar.gz" \
            -T "$root/archive-paths" \
            2> "$RUNNER_TEMP/oseo-perf-correctness-tar.stderr" \
            || archive_status=$?
          cp "$RUNNER_TEMP/oseo-perf-correctness-tar.stderr" \
            "$root/archive.stderr"
          printf '%s\n' "$archive_status" > "$root/archive-tar.status"
          shasum -a 256 "$RUNNER_TEMP/oseo-perf-correctness.tar.gz" \
            > "$RUNNER_TEMP/oseo-perf-correctness.tar.gz.sha256"
          test "$archive_status" -eq 0
          test ! -e "$root/archive-incomplete"
      - name: Upload performance correctness raw records
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: >-
            perf-correctness-raw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oseo-perf-correctness/
          if-no-files-found: error
      - name: Upload performance correctness archive
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: >-
            perf-correctness-tar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oseo-perf-correctness.tar.gz
            ${{ runner.temp }}/oseo-perf-correctness.tar.gz.sha256
          if-no-files-found: error

  # macOS. The wrapper reproduces Node's default discovery, removes the
  # dedicated Array and exhaustive RegExp literal files, and assigns the
  # rest to six shards by measured file weights; see
  # docs/evidence/node-shards/README.md.
  test_node_shard:
    name: >-
      test (macos-latest, node,
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 6
          - shard: 2
            total: 6
          - shard: 3
            total: 6
          - shard: 4
            total: 6
          - shard: 5
            total: 6
          - shard: 6
            total: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node:shard
          --shard=${{ matrix.shard }}/${{ matrix.total }}

  # Hosted macos-latest, like the ordinary Node shards. No time scaling.
  # The generator places this on one of the same five hosted capacity lanes.
  test_array_constructor_macos:
    name: Array constructor (macos-latest, node)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node --test-concurrency=1
          tests/property/m5-array-constructor.property.test.ts

  # Beside other file workers this file's plain properties reached their
  # 600-second interrupt, so it leaves the ordinary shards on both hosts;
  # see docs/evidence/regexp-exhaustive-node/README.md. Hosted macos-latest,
  # one file worker, no time scaling. The generator places this on one of
  # the same five hosted capacity lanes.
  test_regexp_exhaustive_macos:
    name: RegExp literals exhaustive (macos-latest, node)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node --test-concurrency=1
          tests/property/m5-regexp-literal-exhaustive.property.test.ts

  # Linux. The same wrapper assigns Node's discovery, without the dedicated
  # exhaustive RegExp literal file, to four shards by measured file
  # weights. Positional --test-shard left late-sorted heavy files as tails:
  # run 41238903460 ended shard 2/2 at 56.0 minutes while 1/2 took 37.4.
  # The weights, the model and its modeled maxima are in
  # docs/evidence/node-shards/README.md.
  test_node_shard_linux:
    name: >-
      test (ubuntu-latest, node,
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            total: 4
          - shard: 2
            total: 4
          - shard: 3
            total: 4
          - shard: 4
            total: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node:shard
          --shard=${{ matrix.shard }}/${{ matrix.total }}

  # The Linux counterpart of test_regexp_exhaustive_macos: one file
  # worker, every ordinary case and limit, no time scaling.
  test_regexp_exhaustive_linux:
    name: RegExp literals exhaustive (ubuntu-latest, node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:node --test-concurrency=1
          tests/property/m5-regexp-literal-exhaustive.property.test.ts

  test_native:
    name: native (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: mise run test:native --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform.target }}-${{ matrix.shard }}-of-3
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_native_optimized:
    env:
      OSEO_NATIVE_BUILD_CONFIG: optimized
    name: >-
      native optimized (${{ matrix.platform.target }}, ${{ matrix.shard }}/3)
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
          - os: macos-15
            target: macos-aarch64
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: mise run test:native:optimized --shard ${{ matrix.shard }}/3
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            native-optimized-${{ matrix.platform.target }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_sanitizer:
    name: host C sanitizers (Linux, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Run 38957726165 measured 36.1 minutes for the native fixtures and
    # 3.8 for the runtime ones, so one shard carries about 16 minutes and
    # the others 12. 45 minutes leaves cold-cache and slow-runner margin.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 1
          - 2
          - 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
      # Each shard retains its own instrumentation preflight.
      - run: mise run test:sanitizer:self
      # The GCC check and the runtime fixtures do not shard, so one shard
      # carries them.
      - if: matrix.shard == 1
        name: Verify GCC sanitizer instrumentation
        run: mise run test:sanitizer:self
        env:
          OSEO_HOST_CC: gcc
      - if: matrix.shard == 1
        run: mise run test:sanitizer:runtime
      - run: >-
          mise run test:sanitizer:native
          --shard ${{ matrix.shard }}/3
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-failures-${{ matrix.shard }}-of-3
          path: /tmp/oseo-native-*
          if-no-files-found: warn

  test_sanitizer_property:
    name: host C sanitizers (Linux, property, ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # The full suite took 24.80 to 48.30 minutes across fifteen runs.
    # Main run 40090884630 (2026-10-24) canceled shard 2/2 at the
    # 45-minute limit after 149 passing tests. Its runner was about 1.70x
    # slower than the same-tree candidate, where the shard took about
    # 27 minutes. Three shards add margin for that runner variation.
    # Shard 2/3 still took 32 to 43 minutes on main from 2026-10-24 to
    # 2026-10-26, and candidate run 40382931062 hit the limit at 45m11s
    # after all 99 tests passed. Two fixed tests in
    # tests/property/m5-compound-assignment.property.test.ts take about
    # 26 to 36 minutes together and must share one file shard, so this
    # job timeout allows extra time for them; every property keeps its
    # own interrupt limit.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
          - shard: 2
          - shard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
      # Each shard retains its own instrumentation preflight.
      - run: mise run test:sanitizer:self
      # Node's positional shards, without the dedicated sanitizer files.
      - run: >-
          mise run test:sanitizer:property:shared
          --shard ${{ matrix.shard }}/3
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-property-failures-${{ matrix.shard }}-of-3
          path: /tmp/oseo-native-*
          if-no-files-found: warn

  # The dedicated sanitizer property files, left out of the shards above;
  # see docs/evidence/regexp-literal-exhaustive/README.md. Every case keeps
  # its ordinary budget and the lane's interrupt scale.
  test_sanitizer_property_dedicated:
    name: host C sanitizers (Linux, property, regexp literals)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
      - run: mise run test:sanitizer:self
      - run: >-
          mise run test:sanitizer:property:shard
          tests/property/m5-regexp-literal-exhaustive.property.test.ts
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-property-regexp-literals-failures
          path: /tmp/oseo-native-*
          if-no-files-found: warn

  test_sanitizer_macos:
    name: host C sanitizers (macOS, ${{ matrix.label }})
    runs-on: macos-15
    # Each job retains its own instrumentation preflight. The native suite
    # runs as two file shards, with the unsharded runtime fixtures on the
    # first; see docs/evidence/macos-sanitizer-split/README.md. The listed
    # dedicated property files run in their own job; see
    # docs/evidence/regexp-literal-exhaustive/README.md. Run 41191483370
    # cancelled the unsplit native suite at 75.5 minutes on commit 216503f8
    # and passed its rerun at 58.9, so each native shard keeps the 90
    # minutes that suite had and the property jobs keep 75; see
    # docs/sanitizer-activity.md. Each leaves room for setup, cold caches,
    # and slower runner images.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: native
            label: native, 1/2
            part: native-1-of-2
            runtime: 1
            shard: 1
            timeout: 90
          - suite: native
            label: native, 2/2
            part: native-2-of-2
            runtime: 0
            shard: 2
            timeout: 90
          - suite: property
            label: property
            part: property
            runtime: 0
            timeout: 75
          - suite: property
            label: property, regexp literals
            part: property-regexp-literals
            runtime: 0
            timeout: 75
    env:
      OSEO_HOST_CC: clang
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
        with:
          toolchain: host-cc
        env:
          TMPDIR: ${{ runner.temp }}
      - run: mise run test:sanitizer:self
        env:
          TMPDIR: ${{ runner.temp }}
      # No GCC verification: macOS gcc is an Apple Clang alias.
      - if: matrix.runtime == 1
        run: mise run test:sanitizer:runtime
        env:
          TMPDIR: ${{ runner.temp }}
      - if: matrix.suite == 'native'
        run: >-
          mise run test:sanitizer:native
          --shard ${{ matrix.shard }}/2
        env:
          TMPDIR: ${{ runner.temp }}
      - if: matrix.part == 'property'
        run: mise run test:sanitizer:property:shared
        env:
          # Four workers share three CPUs. Double Linux's interrupt allowance,
          # retaining every ordinary case and seed; interruptions still fail.
          OSEO_PROPERTY_TIME_SCALE: "6"
          TMPDIR: ${{ runner.temp }}
      - if: matrix.part == 'property-regexp-literals'
        run: >-
          mise run test:sanitizer:property:shard
          tests/property/m5-regexp-literal-exhaustive.property.test.ts
        env:
          # The same allowance as the shared property job on this runner.
          OSEO_PROPERTY_TIME_SCALE: "6"
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: host-cc-sanitizer-macos-${{ matrix.part }}-failures
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_test262:
    name: >-
      test262 (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 5
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 6
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 7
            total: 8
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 8
            total: 8
          - os: macos-15
            target: macos-aarch64
            shard: 1
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 2
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 3
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 4
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 5
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 6
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 7
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 8
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 9
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 10
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 11
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 12
            total: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:test262
          --shard ${{ matrix.shard }}/${{ matrix.total }}
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'test262-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_native_support:
    name: >-
      native support (${{ matrix.target }},
      ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ${{ matrix.os }}
    # Run 38551733723 lost a Linux shard to the previous 90-minute limit
    # while its work took a measured 32.9 to 62 minutes across runs; the
    # suites carry their own interrupt deadlines, so this is a backstop.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 1
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 2
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 3
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 4
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 5
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 6
            total: 7
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            shard: 7
            total: 7
          - os: macos-15
            target: macos-aarch64
            shard: 1
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 2
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 3
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 4
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 5
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 6
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 7
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 8
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 9
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 10
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 11
            total: 12
          - os: macos-15
            target: macos-aarch64
            shard: 12
            total: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - if: matrix.shard == 1
        run: mise run test:property:extended:package
      - if: matrix.target == 'linux-x86_64-gnu'
        run: >-
          mise run test:property:extended:native:shard
          --shard ${{ matrix.shard }}/${{ matrix.total }}
          --exclude-case-sharded
          --exclude-dedicated-linux
          tests/property/*.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: matrix.target == 'macos-aarch64'
        run: >-
          mise run test:property:extended:native:shard
          --shard ${{ matrix.shard }}/${{ matrix.total }}
          --exclude-case-sharded
          tests/property/*.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format(
            'native-support-diagnostics-{0}-{1}-of-{2}',
            matrix.target,
            matrix.shard,
            matrix.total) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_property_case:
    name: >-
      own-key cases (${{ matrix.target }},
      ${{ matrix.caseShard }}/3)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 1
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 2
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 3
          - os: macos-15
            target: macos-aarch64
            caseShard: 1
          - os: macos-15
            target: macos-aarch64
            caseShard: 2
          - os: macos-15
            target: macos-aarch64
            caseShard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-object-own-keys.property.test.ts
        env:
          OSEO_PROPERTY_CASE_SHARD: ${{ matrix.caseShard }}/3
          OSEO_PROPERTY_DURATION_FILE: ${{ runner.temp }}/duration.json
          TMPDIR: ${{ runner.temp }}
      - if: success()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('own-key-duration-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/duration.json
          if-no-files-found: error
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('own-key-cases-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_reflect_case:
    name: >-
      reflect cases (${{ matrix.target }},
      ${{ matrix.caseShard }}/3)
    runs-on: ${{ matrix.os }}
    # U38 measured a Mac lane at 3 minutes per shard and derives 5.6 for
    # a hosted macOS fallback. A dedicated hosted Linux job has no
    # measurement yet; the 9.8 minutes a third of run 39025004305's
    # contended file shard implies is an upper bound, because that shard
    # gave this file one of four workers. Sixty minutes leaves every one
    # of those a wide margin.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 1
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 2
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 3
          - os: macos-15
            target: macos-aarch64
            caseShard: 1
          - os: macos-15
            target: macos-aarch64
            caseShard: 2
          - os: macos-15
            target: macos-aarch64
            caseShard: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      # No duration record: this file has three property domains and the
      # recorder writes one record per job, so the aggregate's summed
      # deadline check cannot cover it without a record-format change.
      # Each shard still keeps the whole property's interrupt limit and
      # fails on interruption, and run 39025004305 measured the widest
      # suite at 29.8 percent of that limit unsharded.
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-reflect-namespace.property.test.ts
        env:
          OSEO_PROPERTY_CASE_SHARD: ${{ matrix.caseShard }}/3
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('reflect-cases-{0}-{1}-of-3',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_regexp_exhaustive_case:
    name: >-
      regexp exhaustive cases (${{ matrix.target }},
      ${{ matrix.caseShard }}/5)
    runs-on: ${{ matrix.os }}
    # Each shard runs two of the ten extended sweeps of every property.
    # Run 41257794727 measured hosted Linux sweeps of the whole file at a
    # derived 882 seconds beside three other files, so a shard needs about
    # 31 minutes with setup, half of this limit. See
    # docs/evidence/regexp-literal-exhaustive/README.md.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 1
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 2
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 3
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 4
          - os: ubuntu-latest
            target: linux-x86_64-gnu
            caseShard: 5
          - os: macos-15
            target: macos-aarch64
            caseShard: 1
          - os: macos-15
            target: macos-aarch64
            caseShard: 2
          - os: macos-15
            target: macos-aarch64
            caseShard: 3
          - os: macos-15
            target: macos-aarch64
            caseShard: 4
          - os: macos-15
            target: macos-aarch64
            caseShard: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      # No duration record, for the Reflect namespace file's reason: the
      # file has four properties and the recorder writes one record per
      # job. Each shard keeps the whole property's interrupt limit and
      # fails on interruption.
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-regexp-literal-exhaustive.property.test.ts
        env:
          OSEO_PROPERTY_CASE_SHARD: ${{ matrix.caseShard }}/5
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ format('regexp-exhaustive-cases-{0}-{1}-of-5',
            matrix.target, matrix.caseShard) }}
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  test_array_constructor:
    name: Array constructor (linux-x86_64-gnu)
    # Only trusted push/manual runs in dahlia/oseo may use the repository
    # variable's JSON label array. PRs, forks, and an unset variable use
    # ubuntu-latest, so untrusted PR code never selects a self-hosted runner.
    runs-on: >-
      ${{ fromJSON(github.repository == 'dahlia/oseo' &&
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      vars.OSEO_ARRAY_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Runs 40229359492 and 40262591240 stopped at the unchanged 1,800 s
    # property limit after 97 and 92 of 120 cases with four file workers.
    # The same source took about 614 s locally. Allow 30 min for the
    # property plus 15 min for setup/build; this 45 min limit is a backstop.
    timeout-minutes: 45
    # The job may run on a self-hosted runner, so its token can only read.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise
        with:
          install: true
      - uses: ./.github/actions/runtime-archive-cache
      - run: >-
          mise run test:property:extended:native:shard
          tests/property/m5-array-constructor.property.test.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: array-constructor-linux-diagnostics
          path: ${{ runner.temp }}/oseo-native-*
          if-no-files-found: warn

  native:
    # The generator expands needs and replaces steps with success checks.
    if: ${{ always() }}
    needs:
      - test_native
      - test_native_optimized
      - test_sanitizer_property
      - test_sanitizer_property_dedicated
      - test_sanitizer_macos
      - test_native_support
      - test_property_case
      - test_reflect_case
      - test_regexp_exhaustive_case
      - test_array_constructor
      - test_array_constructor_macos
      - test_regexp_exhaustive_linux
      - test_regexp_exhaustive_macos
      - test_test262
    runs-on: ubuntu-latest
    steps:
      - name: Require every native and test262 shard
        run: |
          test "${{ needs.test_native.result }}" = success
          test "${{ needs.test_native_support.result }}" = success
          test "${{ needs.test_array_constructor.result }}" = success
          test "${{ needs.test_array_constructor_macos.result }}" = success
          test "${{ needs.test_regexp_exhaustive_linux.result }}" = success
          test "${{ needs.test_regexp_exhaustive_macos.result }}" = success
          test "${{ needs.test_test262.result }}" = success
